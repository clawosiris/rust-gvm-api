[workspace]
resolver = "2"
members = [
    "crates/gvm-gateway-domain",
    "crates/gvm-gateway-app",
    "crates/gvm-gateway-rest",
    "crates/gvm-gateway-gvmd",
    "crates/gvm-gateway",
    "tests/e2e",
    "tests/performance",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.75.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/clawosiris/rust-gvm-api"
authors = ["clawosiris"]

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
gvm-client = { git = "https://github.com/clawosiris/rust-gvm", rev = "2891b8df36b1f6df467c76843a629be16e5fddc1" }
gvm-connection = { git = "https://github.com/clawosiris/rust-gvm", rev = "2891b8df36b1f6df467c76843a629be16e5fddc1" }
gvm-gmp = { git = "https://github.com/clawosiris/rust-gvm", rev = "2891b8df36b1f6df467c76843a629be16e5fddc1", features = ["serde"] }
gvm-mock-server = { git = "https://github.com/clawosiris/rust-gvm", rev = "2891b8df36b1f6df467c76843a629be16e5fddc1" }
gvm-protocol = { git = "https://github.com/clawosiris/rust-gvm", rev = "2891b8df36b1f6df467c76843a629be16e5fddc1" }
http = "1.4.1"
opentelemetry = { version = "0.32.0", features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-rustls = "0.26.4"
toml = "1.1.2"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.11", features = ["trace"] }
tracing = "0.1.41"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "std"] }
uuid = { version = "1.23.2", features = ["v4", "serde"] }

[workspace.dependencies.reqwest]
version = "0.13.4"
default-features = false
features = ["json", "rustls"]
