[workspace]
resolver = "2"
members = [
    "crates/gvm-rest-api",
    "crates/gvm-grpc-api",
]

[workspace.package]
version = "0.3.0-alpha.6"
edition = "2021"
rust-version = "1.75.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/clawosiris/rust-gvm-api"
authors = ["clawosiris"]

[workspace.dependencies]
# GVM client library
gvm-client = { git = "https://github.com/clawosiris/rust-gvm", branch = "main" }
gvm-gmp = { git = "https://github.com/clawosiris/rust-gvm", branch = "main" }
