[workspace]
resolver = "2"
members = [
    "crates/gvm-gateway-domain",
    "crates/gvm-gateway-app",
    "crates/gvm-gateway-rest",
    "crates/gvm-gateway-gvmd",
    "crates/gvm-gateway",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.75.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/clawosiris/rust-gvm-api"
authors = ["clawosiris"]

[workspace.dependencies]
axum = "0.7.9"
clap = { version = "4.5.38", features = ["derive"] }
http = "1.3.1"
opentelemetry = { version = "0.24.0", features = ["trace"] }
opentelemetry-otlp = { version = "0.31.1", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.24.1", features = ["rt-tokio"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread", "net"] }
toml = "0.8.20"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.2", features = ["trace"] }
tracing = "0.1.41"
tracing-opentelemetry = "0.25.0"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "std"] }

[workspace.dependencies.reqwest]
version = "0.12.15"
default-features = false
features = ["json", "rustls-tls"]
