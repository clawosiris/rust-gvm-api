[workspace]
resolver = "2"
members = [
    "crates/gvm-rest-api",
    "crates/gvm-grpc-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/clawosiris/rust-gvm-api"
authors = ["clawosiris"]

[workspace.dependencies]
# GVM client library
gvm-client = { git = "https://github.com/clawosiris/rust-gvm", branch = "main" }
gvm-gmp = { git = "https://github.com/clawosiris/rust-gvm", branch = "main" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# REST dependencies
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "auth"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
utoipa-redoc = { version = "5", features = ["axum"] }

# gRPC dependencies
tonic = "0.13"
prost = "0.13"
tonic-reflection = "0.13"
tonic-health = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.28"
opentelemetry-otlp = "0.28"

# Error handling
thiserror = "2"
anyhow = "1"

# Configuration
clap = { version = "4", features = ["derive", "env"] }
config = "0.15"

# Auth
jsonwebtoken = "9"

# Health & metrics
prometheus = "0.13"

# Testing
rstest = "0.24"
wiremock = "0.6"
testcontainers = "0.24"
assert_json_diff = "2"
