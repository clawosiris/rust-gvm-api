[package]
name = "gvm-gateway-rest"
description = "REST adapter for the GVM gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aide = { version = "0.16.0-alpha.4", features = ["axum", "axum-json", "axum-query", "axum-original-uri"] }
axum.workspace = true
base64.workspace = true
form_urlencoded = "1.2.2"
gvm-gateway-app = { path = "../gvm-gateway-app" }
gvm-gateway-domain = { path = "../gvm-gateway-domain" }
http.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
schemars = { version = "1.0.4", features = ["uuid1"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
gvm-gateway-gvmd = { path = "../gvm-gateway-gvmd" }
serde_yaml = "0.9.34"
tower.workspace = true
tracing-subscriber.workspace = true
