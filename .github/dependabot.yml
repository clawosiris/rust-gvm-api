version: 2

updates:
  # Rust dependencies (Cargo)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # The rust-gvm workspace crates share one Git revision and must move
    # together. Keep them in one PR so Cargo resolves and tests one coherent
    # upstream snapshot.
    groups:
      rust-gvm-components:
        patterns:
          - "gvm-client"
          - "gvm-connection"
          - "gvm-gmp"
          - "gvm-mock-server"
          - "gvm-protocol"
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      cargo:
        patterns:
          - "*"
        exclude-patterns:
          - "gvm-client"
          - "gvm-connection"
          - "gvm-gmp"
          - "gvm-mock-server"
          - "gvm-protocol"
          - "opentelemetry*"
          - "tracing-opentelemetry"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
      - "rust"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "ci"

  # Container base images (Containerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
      - "container"

  # Compose service images
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
      - "container"
