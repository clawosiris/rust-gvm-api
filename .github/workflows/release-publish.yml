name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Validate tag and repository version
        id: release
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be semver-shaped with a leading 'v': ${TAG}" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          WORKSPACE_VERSION="$(./scripts/workspace-version.sh)"

          if [[ "${WORKSPACE_VERSION}" != "${VERSION}" ]]; then
            echo "Tag ${TAG} does not match Cargo.toml workspace version ${WORKSPACE_VERSION}" >&2
            exit 1
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.ref }}
      - name: Configure git credentials for private deps
        run: git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --workspace --all-features

  package:
    name: Package (${{ matrix.packager }}, ${{ matrix.package_arch }})
    needs: [validate, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - packager: deb
            package_arch: amd64
            runner: ubuntu-latest
          - packager: archlinux
            package_arch: x86_64
            runner: ubuntu-latest
          - packager: deb
            package_arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.ref }}
      - name: Configure git credentials for private deps
        run: git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build release binary
        run: cargo build --locked --release -p gvm-gateway
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build package
        run: ./scripts/package-build.sh --packager "${{ matrix.packager }}" --architecture "${{ matrix.package_arch }}" --version "${{ needs.validate.outputs.version }}" --output-dir dist/packages
      - name: Smoke test package install
        run: ./scripts/package-smoke.sh --packager "${{ matrix.packager }}" --package-dir dist/packages
      - name: Store package assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gvm-gateway-${{ matrix.packager }}-${{ matrix.package_arch }}-release-assets
          path: dist/packages/*
          if-no-files-found: error

  oci:
    name: OCI Image
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.ref }}
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
        with:
          driver: docker-container
      - run: docker buildx version
      - name: Build loadable runtime image
        run: |
          docker buildx build \
            --load \
            --build-arg "GVM_GATEWAY_VERSION=${{ needs.validate.outputs.version }}" \
            --build-arg "GVM_GATEWAY_VCS_REF=$(git rev-parse HEAD)" \
            -t local/gvm-gateway:release \
            -f Containerfile \
            .
      - name: Smoke test runtime image
        run: docker run --rm local/gvm-gateway:release --help >/tmp/gvm-gateway-help.txt
      - name: Export OCI image archive
        run: |
          mkdir -p dist/oci
          docker buildx build \
            --output "type=oci,dest=dist/oci/gvm-gateway-${{ needs.validate.outputs.version }}.oci.tar" \
            --build-arg "GVM_GATEWAY_VERSION=${{ needs.validate.outputs.version }}" \
            --build-arg "GVM_GATEWAY_VCS_REF=$(git rev-parse HEAD)" \
            -f Containerfile \
            .
          sha256sum "dist/oci/gvm-gateway-${{ needs.validate.outputs.version }}.oci.tar" > "dist/oci/gvm-gateway-${{ needs.validate.outputs.version }}.oci.tar.sha256"
      - name: Store OCI assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gvm-gateway-oci-release-assets
          path: dist/oci/*
          if-no-files-found: error

  docs-package:
    name: User Docs Package
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.ref }}
      - name: Build user docs package
        run: ./scripts/build-docs-package.sh --version "${{ needs.validate.outputs.version }}" --output-dir dist/docs
      - name: Store user docs assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-gvm-api-docs-release-assets
          path: dist/docs/*
          if-no-files-found: error

  release-assets:
    name: Publish release assets
    needs: [validate, package, oci, docs-package]
    runs-on: ubuntu-latest
    steps:
      - name: Download generated release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-release-assets"
          path: dist/release-assets
          merge-multiple: true
      - name: Verify OS packages and OCI archive
        run: |
          shopt -s nullglob
          deb_packages=(dist/release-assets/*.deb)
          arch_packages=(dist/release-assets/*.pkg.tar.zst)
          os_packages=("${deb_packages[@]}" "${arch_packages[@]}")
          oci_archives=(dist/release-assets/*.oci.tar)
          docs_archives=(dist/release-assets/rust-gvm-api-docs-*.tar.gz)

          if (( ${#deb_packages[@]} == 0 )); then
            echo "No Debian package artifact was generated for the release" >&2
            exit 1
          fi

          if (( ${#arch_packages[@]} == 0 )); then
            echo "No Arch Linux package artifact was generated for the release" >&2
            exit 1
          fi

          if (( ${#oci_archives[@]} == 0 )); then
            echo "No OCI image archive was generated for the release" >&2
            exit 1
          fi

          if (( ${#docs_archives[@]} == 0 )); then
            echo "No user documentation archive was generated for the release" >&2
            exit 1
          fi

          for asset in "${os_packages[@]}" "${oci_archives[@]}" "${docs_archives[@]}"; do
            if [[ ! -f "${asset}.sha256" ]]; then
              echo "Missing checksum for ${asset}" >&2
              exit 1
            fi
          done
      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            exit 0
          fi

          gh release create "${RELEASE_TAG}" \
            --repo "${GH_REPO}" \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --generate-notes
      - name: Upload generated assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release upload "${RELEASE_TAG}" dist/release-assets/* --clobber

  sbom:
    name: Generate SBOM
    needs: [validate, test, release-assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.ref }}
      - name: Configure git credentials for private deps
        run: git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx
      - name: Generate and upload SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          cargo cyclonedx --format json --all --spec-version 1.5
          cargo cyclonedx --format xml --all --spec-version 1.5
          mkdir -p sbom-artifacts
          find . -name '*.cdx.json' -not -path '*/target/*' -not -path '*/sbom-artifacts/*' -exec cp {} sbom-artifacts/ \;
          find . -name '*.cdx.xml' -not -path '*/target/*' -not -path '*/sbom-artifacts/*' -exec cp {} sbom-artifacts/ \;
          cd sbom-artifacts && tar czf ../rust-gvm-api-sbom.tar.gz -- *.cdx.* && cd ..
          sha256sum rust-gvm-api-sbom.tar.gz > rust-gvm-api-sbom.tar.gz.sha256
          gh release upload "${RELEASE_TAG}" rust-gvm-api-sbom.tar.gz rust-gvm-api-sbom.tar.gz.sha256 --clobber

  collect:
    name: Release complete
    needs: [validate, release-assets, sbom]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All release artifacts published for ${{ needs.validate.outputs.tag }}"
