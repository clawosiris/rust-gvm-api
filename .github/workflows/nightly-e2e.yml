name: Nightly E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GVM_GATEWAY_E2E_BASE_URL: http://127.0.0.1:8080
  GVM_GATEWAY_E2E_USERNAME: admin
  GVM_GATEWAY_E2E_PASSWORD: admin
  GVM_GATEWAY_E2E_TARGET_HOST: openvasd
  GVM_GATEWAY_E2E_READY_TIMEOUT_SECS: "120"
  GVM_GATEWAY_E2E_SCAN_TIMEOUT_SECS: "900"
  GVM_GATEWAY_E2E_POLL_INTERVAL_SECS: "10"

jobs:
  rest-discovery-scan:
    name: REST Discovery Scan E2E
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Configure git credentials for private deps
        run: git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Start compose-backed runtime
        run: ./scripts/compose-dev.sh up -d --build
      - name: Wait for gateway readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/ready | grep -q '"status":"ready"'; then
              echo "Gateway is ready on attempt ${attempt}"
              exit 0
            fi
            echo "Gateway not ready yet (attempt ${attempt}/60)"
            ./scripts/compose-dev.sh ps || true
            sleep 20
          done
          echo "Gateway never became ready"
          exit 1
      - name: Run REST discovery-scan E2E suite
        run: cargo test -p gvm-gateway-e2e --test rest_discovery_scan -- --ignored --nocapture
      - name: Capture compose diagnostics
        if: always()
        run: |
          mkdir -p dist/e2e
          ./scripts/compose-dev.sh ps > dist/e2e/compose-ps.txt || true
          ./scripts/compose-dev.sh logs --no-color > dist/e2e/compose.log || true
      - name: Upload compose diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-e2e-compose-diagnostics
          path: dist/e2e/*
      - name: Tear down compose stack
        if: always()
        run: ./scripts/compose-dev.sh down -v
