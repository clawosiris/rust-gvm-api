# Orchestrated Release — triggered by clawosiris/release-orchestrator
# Do NOT trigger manually — use the orchestrator instead.

name: Orchestrated Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without 'v' prefix)"
        required: true
        type: string
      release-type:
        description: "Release type (alpha, beta, release-candidate, patch, minor, major)"
        required: false
        type: string
        default: "patch"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────
  # Step 1: Pin deps + version bump + tag + GH Release
  # ──────────────────────────────────────────────
  prepare:
    name: "Prepare v${{ inputs.version }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Allow admin users bypassing protection on main branch
        uses: greenbone/actions/admin-bypass@v3
        with:
          allow: "true"
          github-token: ${{ secrets.RELEASE_TOKEN }}
          branch: "main"

      - name: Configure git (token + origin)
        uses: greenbone/actions/set-github-user@v3
        with:
          user: ${{ vars.RELEASE_USER || 'clawosiris' }}
          mail: ${{ vars.RELEASE_USER_MAIL || 'clawosiris@users.noreply.github.com' }}
          token: ${{ secrets.RELEASE_TOKEN }}


      # Pin rust-gvm dependency on stable releases
      - name: Pin upstream dependencies
        run: |
          VERSION="${{ inputs.version }}"
          if [[ "$VERSION" != *"-"* ]]; then
            sed -i "s|branch = \"main\"|tag = \"v$VERSION\"|g" Cargo.toml
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml
            git commit -m "build(deps): pin rust-gvm to v$VERSION" || true
            git push
          else
            echo "Pre-release: keeping branch = main"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Disable bypassing protection on main branch for admin users
        if: always()
        uses: greenbone/actions/admin-bypass@v3
        with:
          allow: "false"
          github-token: ${{ secrets.RELEASE_TOKEN }}
          branch: "main"

      - name: Create release
        uses: greenbone/actions/release@v3
        with:
          github-user: ${{ vars.RELEASE_USER || 'clawosiris' }}
          github-user-mail: ${{ vars.RELEASE_USER_MAIL || 'clawosiris@users.noreply.github.com' }}
          github-user-token: ${{ secrets.RELEASE_TOKEN }}
          release-type: ${{ inputs.release-type }}
          release-version: ${{ inputs.version }}
          versioning-scheme: semver
          project-types: cargo
          next-version: "false"

      - name: Regenerate Cargo.lock
        run: |
          cargo generate-lockfile
          if ! git diff --quiet Cargo.lock 2>/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit --amend --no-edit
            git push --force-with-lease
            TAG="v${{ inputs.version }}"
            git tag -f "$TAG"
            git push origin "$TAG" --force
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # ──────────────────────────────────────────────
  # Step 2: Test
  # ──────────────────────────────────────────────
  test:
    name: Test
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: v${{ inputs.version }}
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Allow admin users bypassing protection on main branch
        uses: greenbone/actions/admin-bypass@v3
        with:
          allow: "true"
          github-token: ${{ secrets.RELEASE_TOKEN }}
          branch: "main"

      - name: Configure git (token + origin)
        uses: greenbone/actions/set-github-user@v3
        with:
          user: ${{ vars.RELEASE_USER || 'clawosiris' }}
          mail: ${{ vars.RELEASE_USER_MAIL || 'clawosiris@users.noreply.github.com' }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo test --workspace --all-features

  # ──────────────────────────────────────────────
  # Step 3: Build artifacts (parallel)
  # ──────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: rust-gvm-api-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: rust-gvm-api-linux-arm64
            cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: rust-gvm-api-linux-amd64-musl
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: rust-gvm-api-macos-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: rust-gvm-api-macos-arm64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: v${{ inputs.version }}
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Allow admin users bypassing protection on main branch
        uses: greenbone/actions/admin-bypass@v3
        with:
          allow: "true"
          github-token: ${{ secrets.RELEASE_TOKEN }}
          branch: "main"

      - name: Configure git (token + origin)
        uses: greenbone/actions/set-github-user@v3
        with:
          user: ${{ vars.RELEASE_USER || 'clawosiris' }}
          mail: ${{ vars.RELEASE_USER_MAIL || 'clawosiris@users.noreply.github.com' }}
          token: ${{ secrets.RELEASE_TOKEN }}

        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} --workspace
      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }} --workspace
      - name: Package
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/gvm-rest-api staging/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/gvm-grpc-api staging/ 2>/dev/null || true
          cd staging
          tar czf ../${{ matrix.artifact }}.tar.gz *
          cd ..
          sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  sbom:
    name: Generate SBOM
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: v${{ inputs.version }}
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Allow admin users bypassing protection on main branch
        uses: greenbone/actions/admin-bypass@v3
        with:
          allow: "true"
          github-token: ${{ secrets.RELEASE_TOKEN }}
          branch: "main"

      - name: Configure git (token + origin)
        uses: greenbone/actions/set-github-user@v3
        with:
          user: ${{ vars.RELEASE_USER || 'clawosiris' }}
          mail: ${{ vars.RELEASE_USER_MAIL || 'clawosiris@users.noreply.github.com' }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx
      - name: Generate CycloneDX SBOM (JSON)
        run: cargo cyclonedx --format json --all --spec-version 1.5
      - name: Generate CycloneDX SBOM (XML)
        run: cargo cyclonedx --format xml --all --spec-version 1.5
      - name: Collect SBOMs
        shell: bash
        run: |
          mkdir -p sbom-artifacts
          find . -name '*.cdx.json' -not -path '*/target/*' -not -path '*/fixtures/*' -not -path '*/sbom-artifacts/*' -exec cp {} sbom-artifacts/ \;
          find . -name '*.cdx.xml' -not -path '*/target/*' -not -path '*/fixtures/*' -not -path '*/sbom-artifacts/*' -exec cp {} sbom-artifacts/ \;
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: sbom
          path: sbom-artifacts/

  # ──────────────────────────────────────────────
  # Step 4: Upload artifacts to GH Release
  # ──────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: v${{ inputs.version }}
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ inputs.version }}" artifacts/*.tar.gz artifacts/*.sha256 --clobber
