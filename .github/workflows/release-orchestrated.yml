name: Orchestrated Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without 'v' prefix)"
        required: true
        type: string
      release-type:
        description: "Release type (alpha, beta, release-candidate, patch, minor, major)"
        required: false
        type: string
        default: "patch"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: "Prepare v${{ inputs.version }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - name: Pin upstream dependencies
        run: |
          VERSION="${{ inputs.version }}"
          if [[ "$VERSION" != *"-"* ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            sed -i "s|branch = \"main\"|tag = \"v$VERSION\"|g" Cargo.toml
            git add Cargo.toml
            git commit -m "build(deps): pin rust-gvm to v$VERSION" || true
            git push
          else
            echo "Pre-release: keeping branch = main"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - name: Create release
        uses: greenbone/actions/release@v3
        with:
          github-user: ${{ vars.RELEASE_USER || 'clawosiris' }}
          github-user-mail: ${{ vars.RELEASE_USER_MAIL || 'clawosiris@users.noreply.github.com' }}
          github-user-token: ${{ secrets.RELEASE_TOKEN }}
          release-type: ${{ inputs.release-type }}
          release-version: ${{ inputs.version }}
          versioning-scheme: semver
          project-types: cargo
          next-version: "false"
          admin-bypass: "false"
      - name: Regenerate Cargo.lock
        run: |
          cargo generate-lockfile
          if ! git diff --quiet Cargo.lock 2>/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            git add Cargo.lock
            git commit --amend --no-edit
            git push --force-with-lease
            TAG="v${{ inputs.version }}"
            git tag -f "$TAG"
            git push origin "$TAG" --force
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  test:
    name: Test
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: v${{ inputs.version }}
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --workspace --all-features

  package:
    name: Package (${{ matrix.packager }}, ${{ matrix.package_arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - packager: deb
            package_arch: amd64
            runner: ubuntu-latest
          - packager: archlinux
            package_arch: x86_64
            runner: ubuntu-latest
          - packager: deb
            package_arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - name: Configure git credentials for private deps
        run: git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build release binary
        run: cargo build --locked --release -p gvm-gateway
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build package
        run: ./scripts/package-build.sh --packager "${{ matrix.packager }}" --architecture "${{ matrix.package_arch }}" --version "${{ inputs.version }}" --output-dir dist/packages
      - name: Smoke test package install
        run: ./scripts/package-smoke.sh --packager "${{ matrix.packager }}" --package-dir dist/packages
      - name: Store package assets
        uses: actions/upload-artifact@v7
        with:
          name: gvm-gateway-${{ matrix.packager }}-${{ matrix.package_arch }}-release-assets
          path: dist/packages/*
          if-no-files-found: error

  oci:
    name: OCI Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: v${{ inputs.version }}
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - run: docker buildx version
      - name: Build loadable runtime image
        run: |
          docker buildx build \
            --load \
            --build-arg "GVM_GATEWAY_VERSION=${{ inputs.version }}" \
            --build-arg "GVM_GATEWAY_VCS_REF=$(git rev-parse HEAD)" \
            -t local/gvm-gateway:release \
            -f Containerfile \
            .
      - name: Smoke test runtime image
        run: docker run --rm local/gvm-gateway:release --help >/tmp/gvm-gateway-help.txt
      - name: Export OCI image archive
        run: |
          mkdir -p dist/oci
          docker buildx build \
            --output "type=oci,dest=dist/oci/gvm-gateway-${{ inputs.version }}.oci.tar" \
            --build-arg "GVM_GATEWAY_VERSION=${{ inputs.version }}" \
            --build-arg "GVM_GATEWAY_VCS_REF=$(git rev-parse HEAD)" \
            -f Containerfile \
            .
          sha256sum "dist/oci/gvm-gateway-${{ inputs.version }}.oci.tar" > "dist/oci/gvm-gateway-${{ inputs.version }}.oci.tar.sha256"
      - name: Store OCI assets
        uses: actions/upload-artifact@v7
        with:
          name: gvm-gateway-oci-release-assets
          path: dist/oci/*
          if-no-files-found: error

  release-assets:
    name: Publish release assets
    needs: [package, oci]
    runs-on: ubuntu-latest
    steps:
      - name: Download generated release assets
        uses: actions/download-artifact@v7
        with:
          pattern: gvm-gateway-*-release-assets
          path: dist/release-assets
          merge-multiple: true
      - name: Verify OS packages and OCI archive
        run: |
          shopt -s nullglob
          deb_packages=(dist/release-assets/*.deb)
          arch_packages=(dist/release-assets/*.pkg.tar.zst)
          os_packages=("${deb_packages[@]}" "${arch_packages[@]}")
          oci_archives=(dist/release-assets/*.oci.tar)

          if (( ${#deb_packages[@]} == 0 )); then
            echo "No Debian package artifact was generated for the release" >&2
            exit 1
          fi

          if (( ${#arch_packages[@]} == 0 )); then
            echo "No Arch Linux package artifact was generated for the release" >&2
            exit 1
          fi

          if (( ${#oci_archives[@]} == 0 )); then
            echo "No OCI image archive was generated for the release" >&2
            exit 1
          fi

          for asset in "${os_packages[@]}" "${oci_archives[@]}"; do
            if [[ ! -f "${asset}.sha256" ]]; then
              echo "Missing checksum for ${asset}" >&2
              exit 1
            fi
          done
      - name: Upload generated assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "v${{ inputs.version }}" dist/release-assets/* --clobber

  sbom:
    name: Generate SBOM
    needs: [test, release-assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: v${{ inputs.version }}
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx
      - name: Generate and upload SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo cyclonedx --format json --all --spec-version 1.5
          cargo cyclonedx --format xml --all --spec-version 1.5
          mkdir -p sbom-artifacts
          find . -name '*.cdx.json' -not -path '*/target/*' -not -path '*/sbom-artifacts/*' -exec cp {} sbom-artifacts/ \;
          find . -name '*.cdx.xml' -not -path '*/target/*' -not -path '*/sbom-artifacts/*' -exec cp {} sbom-artifacts/ \;
          cd sbom-artifacts && tar czf ../rust-gvm-api-sbom.tar.gz *.cdx.* && cd ..
          sha256sum rust-gvm-api-sbom.tar.gz > rust-gvm-api-sbom.tar.gz.sha256
          gh release upload "v${{ inputs.version }}" rust-gvm-api-sbom.tar.gz rust-gvm-api-sbom.tar.gz.sha256 --clobber

  collect:
    name: Release complete
    needs: [release-assets, sbom]
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ All release artifacts published for v${{ inputs.version }}"
