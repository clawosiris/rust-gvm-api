name: Create Release Tag

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read

env:
  RELEASE_LABEL: release

jobs:
  tag:
    name: Create release tag
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create tag for labeled release PR
        env:
          RELEASE_AUTH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          CURRENT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PREVIOUS_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          parse_workspace_version() {
            awk '
              $0 == "[workspace.package]" { in_block = 1; next }
              /^\[/ && $0 != "[workspace.package]" { in_block = 0 }
              in_block && $1 == "version" {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' "$1"
          }

          if [[ "${PR_LABELS}" != *"\"${RELEASE_LABEL}\""* ]]; then
            echo "Merged PR #${PR_NUMBER} does not have label '${RELEASE_LABEL}'; skipping release tag creation"
            exit 0
          fi

          if ! git show "${PREVIOUS_SHA}:Cargo.toml" > /tmp/previous-Cargo.toml 2>/dev/null; then
            echo "Previous commit has no Cargo.toml; skipping release tag creation"
            exit 0
          fi

          PREVIOUS_VERSION="$(parse_workspace_version /tmp/previous-Cargo.toml)"
          CURRENT_VERSION="$(parse_workspace_version Cargo.toml)"

          if [[ -z "${CURRENT_VERSION}" ]]; then
            echo "Could not read current workspace version from Cargo.toml" >&2
            exit 1
          fi

          if [[ "${CURRENT_VERSION}" == "${PREVIOUS_VERSION}" ]]; then
            echo "Workspace version is unchanged at ${CURRENT_VERSION}; skipping release tag creation"
            exit 0
          fi

          if [[ ! "${CURRENT_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Workspace version is not semver-shaped: ${CURRENT_VERSION}" >&2
            exit 1
          fi

          TAG="v${CURRENT_VERSION}"

          if [[ -z "${RELEASE_AUTH_TOKEN}" ]]; then
            echo "RELEASE_TOKEN is required to push release tags and trigger publish workflow runs" >&2
            exit 1
          fi

          git fetch --force --tags origin

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            if [[ "${TAG_SHA}" == "${CURRENT_SHA}" ]]; then
              echo "Tag ${TAG} already points at ${CURRENT_SHA}; nothing to do"
              exit 0
            fi

            echo "Tag ${TAG} already exists at ${TAG_SHA}, not ${CURRENT_SHA}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${RELEASE_AUTH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git tag -a "${TAG}" "${CURRENT_SHA}" -m "Release ${TAG}"
          git push origin "${TAG}"

          echo "Created ${TAG} from release PR #${PR_NUMBER}"
