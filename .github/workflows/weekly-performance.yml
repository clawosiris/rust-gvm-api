name: Weekly Performance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 0"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GVM_GATEWAY_E2E_BASE_URL: http://127.0.0.1:8080
  GVM_GATEWAY_E2E_USERNAME: admin
  GVM_GATEWAY_E2E_PASSWORD: admin
  GVM_GATEWAY_E2E_TARGET_HOST: openvasd
  GVM_GATEWAY_E2E_READY_TIMEOUT_SECS: "120"
  GVM_GATEWAY_E2E_RESOURCE_TIMEOUT_SECS: "1200"
  GVM_GATEWAY_E2E_POLL_INTERVAL_SECS: "10"
  GVM_GATEWAY_PERF_ITERATIONS: "5"
  GVM_GATEWAY_PERF_WARMUP_ITERATIONS: "1"
  GVM_GATEWAY_PERF_OUTPUT_DIR: dist/performance

jobs:
  rest-smoke-performance:
    name: REST Smoke Performance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure git credentials for private deps
        run: git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Start compose-backed runtime
        run: ./scripts/compose-dev.sh up -d --build
      - name: Run performance suite
        run: ./scripts/run-performance-tests.sh
      - name: Capture compose diagnostics
        if: always()
        run: |
          mkdir -p dist/performance
          ./scripts/compose-dev.sh ps > dist/performance/compose-ps.txt || true
          ./scripts/compose-dev.sh logs --no-color > dist/performance/compose.log || true
      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weekly-performance
          path: dist/performance/*
      - name: Tear down compose stack
        if: always()
        run: ./scripts/compose-dev.sh down -v
