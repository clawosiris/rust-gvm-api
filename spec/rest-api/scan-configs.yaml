openapi: 3.1.0

paths:
  /scan-configs:
    get:
      operationId: getScanConfigs
      tags: [Scan Configs]
      summary: List scan configurations
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of scan configs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanConfigList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
    post:
      operationId: createScanConfig
      tags: [Scan Configs]
      summary: Create a scan configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScanConfig"
      responses:
        "201":
          description: Scan config created
          headers:
            Location:
              $ref: "./common.yaml#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/ResourceCreated"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /scan-configs/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getScanConfig
      tags: [Scan Configs]
      summary: Get a scan configuration
      responses:
        "200":
          description: Scan config details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanConfig"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    put:
      operationId: modifyScanConfig
      tags: [Scan Configs]
      summary: Modify a scan configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyScanConfig"
      responses:
        "200":
          description: Scan config updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanConfig"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    delete:
      operationId: deleteScanConfig
      tags: [Scan Configs]
      summary: Delete a scan configuration
      description: Deletes a scan configuration. Pass `ultimate=true` to request permanent backend deletion instead of the default non-ultimate delete.
      parameters:
        - $ref: "./common.yaml#/components/parameters/UltimateDelete"
      responses:
        "204":
          description: Scan config deleted
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /scan-configs/{id}/nvts:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getScanConfigNvts
      tags: [Scan Configs]
      summary: List selected NVTs
      parameters:
        - name: family
          in: query
          schema: { type: string }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Selected NVTs
          content:
            application/json:
              schema:
                $ref: "./supporting-resources.yaml#/components/schemas/NvtList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /scan-configs/{id}/nvts/{oid}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
      - name: oid
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getScanConfigNvt
      tags: [Scan Configs]
      summary: Get a selected NVT
      responses:
        "200":
          description: Selected NVT
          content:
            application/json:
              schema:
                $ref: "./supporting-resources.yaml#/components/schemas/Nvt"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /scan-configs/{id}/preferences:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getScanConfigPreferences
      tags: [Scan Configs]
      summary: List configured preferences
      parameters:
        - name: nvtOid
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Configured preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanConfigPreferenceList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /scan-configs/{id}/preferences/{name}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getScanConfigPreference
      tags: [Scan Configs]
      summary: Get a configured preference
      parameters:
        - name: nvtOid
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Configured preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanConfigPreference"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
    put:
      operationId: setScanConfigPreference
      tags: [Scan Configs]
      summary: Set or reset a configured preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetScanConfigPreference"
      responses:
        "204": { description: Preference updated }
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /scan-configs/{id}/families/{family}/nvts:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
      - name: family
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: setScanConfigNvtSelection
      tags: [Scan Configs]
      summary: Replace a family's NVT selection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetScanConfigNvtSelection"
      responses:
        "204": { description: NVT selection replaced }
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /scan-configs/{id}/family-selection:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    put:
      operationId: setScanConfigFamilySelection
      tags: [Scan Configs]
      summary: Replace family selection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetScanConfigFamilySelection"
      responses:
        "204": { description: Family selection replaced }
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
components:
  schemas:
    ScanConfig:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        comment:
          type: string
        familyCount:
          type: integer
        nvtCount:
          type: integer
        type:
          type: integer
          description: "Config type: 0 = standard OpenVAS config, 1 = OSP config."
        usageType:
          type: string
          description: "Backend usage-type discriminator: `scan` or `policy`."
        inUse:
          type: boolean
        writable:
          type: boolean

    CreateScanConfig:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        comment:
          type: string
        baseScanConfigId:
          type: string
          format: uuid
          description: UUID of the config to copy from.

    ModifyScanConfig:
      type: object
      properties:
        name:
          type: string
        comment:
          type: string

    ScanConfigList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ScanConfig"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    ScanConfigPreference:
      type: object
      required: [name]
      properties:
        nvt:
          type: object
          required: [oid]
          properties:
            oid: { type: string }
            name: { type: string }
        name: { type: string }
        id: { type: string }
        type: { type: string }
        value: { type: string }
        alternatives:
          type: array
          items: { type: string }
        default: { type: string }

    ScanConfigPreferenceList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ScanConfigPreference"

    SetScanConfigNvtSelection:
      type: object
      required: [nvtOids]
      additionalProperties: false
      properties:
        nvtOids:
          type: array
          maxItems: 10000
          items: { type: string, maxLength: 255 }

    SetScanConfigFamilySelection:
      type: object
      required: [families]
      additionalProperties: false
      properties:
        families:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [name, growing, all]
            additionalProperties: false
            properties:
              name: { type: string, maxLength: 512 }
              growing: { type: boolean }
              all: { type: boolean }
        autoAddNewFamilies: { type: boolean, default: false }

    SetScanConfigPreference:
      type: object
      additionalProperties: false
      properties:
        nvtOid: { type: string, maxLength: 255 }
        value: { type: string, maxLength: 65536 }
