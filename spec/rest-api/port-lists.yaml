openapi: 3.1.0

paths:
  /port-lists:
    get:
      operationId: getPortLists
      tags: [Port Lists]
      summary: List port lists
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of port lists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortListList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
    post:
      operationId: createPortList
      tags: [Port Lists]
      summary: Create a port list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortList"
      responses:
        "201":
          description: Port list created
          headers:
            Location:
              $ref: "./common.yaml#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/ResourceCreated"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /port-lists/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getPortList
      tags: [Port Lists]
      summary: Get a port list
      responses:
        "200":
          description: Port list details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    put:
      operationId: modifyPortList
      tags: [Port Lists]
      summary: Modify a port list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyPortList"
      responses:
        "200":
          description: Port list updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    delete:
      operationId: deletePortList
      tags: [Port Lists]
      summary: Delete a port list
      description: Deletes a port list. Pass `ultimate=true` to request permanent backend deletion instead of the default non-ultimate delete.
      parameters:
        - $ref: "./common.yaml#/components/parameters/UltimateDelete"
      responses:
        "204":
          description: Port list deleted
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

components:
  schemas:
    PortList:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        comment:
          type: string
        portCount:
          type: integer
          description: Total number of ports in the list.
        tcpCount:
          type: integer
        udpCount:
          type: integer
        inUse:
          type: boolean
        writable:
          type: boolean

    PortListList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PortList"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    CreatePortList:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        comment:
          type: string
        portRange:
          type: string

    ModifyPortList:
      type: object
      properties:
        name:
          type: string
        comment:
          type: string
        portRange:
          type: string
