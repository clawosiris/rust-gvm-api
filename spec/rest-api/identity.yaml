components:
  schemas:
    IdentityResourceBase:
      type: object
      required:
        - id
        - name
        - writable
        - inUse
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        comment:
          type: string
        owner:
          $ref: "./common.yaml#/components/schemas/ResourceRef"
        creationTime:
          type: string
          format: date-time
        modificationTime:
          type: string
          format: date-time
        writable:
          type: boolean
        inUse:
          type: boolean

    User:
      allOf:
        - $ref: "#/components/schemas/IdentityResourceBase"
        - type: object
          properties:
            roles:
              type: array
              items:
                $ref: "./common.yaml#/components/schemas/ResourceRef"
            groups:
              type: array
              items:
                $ref: "./common.yaml#/components/schemas/ResourceRef"
            hostsAllow:
              type: boolean
              description: Whether the host restriction acts as an allow-list (`true`) or deny-list (`false`).
            hosts:
              type: string
              description: Host restriction expression as stored by gvmd.
            authenticationType:
              type: string
              enum:
                - file
                - ldap_connect
                - radius_connect

    CreateUser:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        comment:
          type: string
        password:
          type: string
          format: password
        hosts:
          type: string
        roles:
          type: array
          items:
            type: string
            format: uuid
        authenticationType:
          type: string
          enum:
            - file
            - ldap_connect
            - radius_connect

    ModifyUser:
      type: object
      properties:
        comment:
          type: string
        password:
          type: string
          format: password
        hosts:
          type: string
        roles:
          type: array
          items:
            type: string
            format: uuid
        authenticationType:
          type: string
          enum:
            - file
            - ldap_connect
            - radius_connect

    UserList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    Group:
      allOf:
        - $ref: "#/components/schemas/IdentityResourceBase"
        - type: object
          properties:
            users:
              type: array
              items:
                type: string

    CreateGroup:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        comment:
          type: string
        users:
          type: array
          items:
            type: string

    ModifyGroup:
      type: object
      properties:
        comment:
          type: string
        users:
          type: array
          items:
            type: string

    GroupList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Group"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    Role:
      allOf:
        - $ref: "#/components/schemas/IdentityResourceBase"
        - type: object
          properties:
            users:
              type: array
              items:
                type: string

    CreateRole:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        comment:
          type: string
        users:
          type: array
          items:
            type: string

    ModifyRole:
      type: object
      properties:
        comment:
          type: string
        users:
          type: array
          items:
            type: string

    RoleList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    Permission:
      allOf:
        - $ref: "#/components/schemas/IdentityResourceBase"
        - type: object
          properties:
            subjectType:
              type: string
              enum:
                - user
                - group
                - role
            subject:
              $ref: "./common.yaml#/components/schemas/ResourceRef"
            resourceType:
              type: string
              description: Backend resource type name used by gvmd for the grant target.
            resource:
              $ref: "./common.yaml#/components/schemas/ResourceRef"

    CreatePermission:
      type: object
      properties:
        name:
          type: string
        comment:
          type: string
        subjectType:
          type: string
          enum:
            - user
            - group
            - role
        subjectId:
          type: string
          format: uuid
        resourceType:
          type: string
        resourceId:
          type: string
          format: uuid

    ModifyPermission:
      type: object
      properties:
        name:
          type: string
        comment:
          type: string
        subjectType:
          type: string
          enum:
            - user
            - group
            - role
        subjectId:
          type: string
          format: uuid
        resourceType:
          type: string
        resourceId:
          type: string
          format: uuid

    PermissionList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    UserSetting:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        value:
          type: string
        comment:
          type: string

    UserSettingList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserSetting"

    ModifyUserSetting:
      type: object
      required:
        - value
      properties:
        value:
          type: string
