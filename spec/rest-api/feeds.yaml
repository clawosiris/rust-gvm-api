openapi: 3.1.0

paths:
  /feeds:
    get:
      operationId: getFeeds
      tags: [Feeds]
      summary: Get feed status
      description: Returns feed status, optionally filtered by feed type.
      parameters:
        - name: type
          in: query
          required: false
          description: Return one known feed type.
          schema:
            type: string
            enum:
              - NVT
              - CERT
              - SCAP
              - GVMD_DATA
      responses:
        "200":
          description: Feed status for all feed types
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

components:
  schemas:
    Feed:
      type: object
      required:
        - type
        - name
        - version
      properties:
        type:
          type: string
          enum:
            - NVT
            - CERT
            - SCAP
            - GVMD_DATA
        name:
          type: string
        version:
          type: string
        description:
          type: string
        status:
          type: string
        syncError:
          type: string
        syncTimestamp:
          type: string
          format: date-time
        currentlySyncing:
          type: boolean

    FeedList:
      type: object
      required:
        - data
        - feedOwnerConfigured
        - feedRolesConfigured
        - feedResourcesAccess
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Feed"
        feedOwnerConfigured:
          type: boolean
        feedRolesConfigured:
          type: boolean
        feedResourcesAccess:
          type: boolean
