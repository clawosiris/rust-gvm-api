openapi: 3.1.0

paths:
  /feeds:
    get:
      operationId: getFeeds
      tags: [Feeds]
      summary: Get feed status
      responses:
        "200":
          description: Feed status for all feed types
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /feeds/sync:
    post:
      operationId: syncFeeds
      tags: [Feeds]
      summary: Trigger feed synchronization
      description: |
        Documented action-style exception to the default collection/item rule.
        Use this endpoint for global feed synchronization because the operation
        triggers backend work rather than creating a stable child resource.
      responses:
        "202":
          description: Feed synchronization accepted
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

components:
  schemas:
    Feed:
      type: object
      required:
        - type
        - name
        - version
      properties:
        type:
          type: string
          enum:
            - NVT
            - CERT
            - SCAP
            - GVMD_DATA
        name:
          type: string
        version:
          type: string
        description:
          type: string
        currentlySyncing:
          type: boolean

    FeedList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Feed"
