openapi: 3.1.0

info:
  title: GVM REST API
  description: |
    RESTful API for Greenbone Vulnerability Management (GVM).

    Authenticate once to receive a session token; use that token for all
    subsequent requests. Sessions reduce connection overhead for multi-request
    workflows — the server manages all connection state on your behalf.

    ## Authentication flow

    1. `POST /api/v1/session` with HTTP Basic credentials.
    2. On success the API returns an opaque `sessionToken`.
    3. Include the token on all subsequent requests as:
       `Authorization: Bearer <sessionToken>`
    4. `DELETE /api/v1/session` ends the session.

    Sessions expire after a configurable idle timeout (default 5 min).
    One active session token maps to one authenticated backend execution
    context; commands on the same token are serialized against that backend
    session and queue saturation is surfaced as backpressure rather than
    hidden retry behavior.

    ## Tracing (OpenTelemetry)

    The API uses OpenTelemetry for distributed tracing.
    Clients should propagate W3C Trace Context headers:
    - `traceparent`
    - `tracestate` (optional)
    - `baggage` (optional)
    Responses return `traceparent` and, when present, `tracestate` for correlation.
    `baggage` is accepted as parent context input but is not echoed back in responses.

    > **Note:** A future version of the API may support stateless per-request
    > authentication for simpler single-call use cases. For now, session-based
    > auth is the only supported mechanism.
  version: 0.1.0
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later

