components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        GVM username and password. Used to create a persistent session
        (`POST /api/v1/sessions`) or to authenticate one protected request
        with request-scoped backend cleanup.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Opaque session token returned by `POST /api/v1/sessions`.
        May be presented on subsequent protected requests instead of Basic
        credentials.
