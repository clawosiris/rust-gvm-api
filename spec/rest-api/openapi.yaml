openapi: 3.1.0

info:
  title: GVM REST API
  description: |
    RESTful API for Greenbone Vulnerability Management (GVM).

    Current delivered scope is the protected Targets CRUD surface. Clients must
    provide an existing bearer token as `Authorization: Bearer <token>` on
    protected endpoints. The gateway uses a session-backed model internally,
    but public REST session-management endpoints are deferred to a later phase.

    ## Tracing (OpenTelemetry)

    The API uses OpenTelemetry for distributed tracing.
    Clients should propagate W3C Trace Context headers:
    - `traceparent`
    - `tracestate` (optional)
    - `baggage` (optional)

    > **Note:** A future version of the API may support stateless per-request
    > authentication for simpler single-call use cases. For now, session-based
    > auth is the only supported mechanism.
  version: 0.1.0
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later

servers:
  - url: /api/v1
    description: Base path for all API endpoints

security:
  - bearerAuth: []

tags:
  - name: Targets
    description: Scan target management
  - name: Tasks
    description: Scan task management and control
  - name: Reports
    description: Scan report retrieval and export
  - name: Results
    description: Individual scan result retrieval
  - name: Scan Configs
    description: Scan configuration management
  - name: Scanners
    description: Scanner information
  - name: Alerts
    description: Alert management
  - name: Schedules
    description: Schedule management
  - name: Credentials
    description: Credential management
  - name: Port Lists
    description: Port list management
  - name: Feeds
    description: Feed status
  - name: System
    description: System and health endpoints

