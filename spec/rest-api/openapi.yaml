openapi: 3.1.0
info:
  title: GVM REST API
  description: |
    RESTful API for Greenbone Vulnerability Management (GVM).

    This API acts as a stateful proxy in front of `gvmd`, translating
    JSON/HTTP requests into GMP commands and back. Every authenticated
    workflow begins with a **session**: the client authenticates once and
    receives a bearer token that is bound to a dedicated, persistent gvmd
    connection on the server side.

    ## Authentication flow

    1. `POST /api/v1/sessions` with HTTP Basic credentials.
    2. The proxy opens and authenticates a gvmd connection.
    3. On success the proxy returns an opaque `session_token`.
    4. All subsequent requests pass that token as
       `Authorization: Bearer <session_token>`.
    5. `DELETE /api/v1/sessions/{token}` tears the session down.

    Sessions expire after a configurable idle timeout (default 5 min).
  version: 0.1.0
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later

servers:
  - url: /api/v1
    description: Base path for all API endpoints

security:
  - bearerAuth: []

tags:
  - name: Sessions
    description: Session lifecycle (create, inspect, destroy)
  - name: Targets
    description: Scan target management
  - name: Tasks
    description: Scan task management and control
  - name: Reports
    description: Scan report retrieval and export
  - name: Results
    description: Individual scan result retrieval
  - name: Scan Configs
    description: Scan configuration management
  - name: Scanners
    description: Scanner information
  - name: Alerts
    description: Alert management
  - name: Schedules
    description: Schedule management
  - name: Credentials
    description: Credential management
  - name: Port Lists
    description: Port list management
  - name: Feeds
    description: Feed status
  - name: System
    description: System and health endpoints

paths:
  # ─── Sessions ───────────────────────────────────────────────
  /sessions:
    post:
      operationId: createSession
      tags: [Sessions]
      summary: Create a new session
      description: |
        Authenticates against gvmd using the supplied Basic credentials,
        opens a persistent gvmd connection, and returns an opaque session
        token. The token must be presented as a Bearer token on all
        subsequent requests.
      security:
        - basicAuth: []
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"

  /sessions/{token}:
    parameters:
      - $ref: "#/components/parameters/SessionToken"
    get:
      operationId: getSession
      tags: [Sessions]
      summary: Inspect a session
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSession
      tags: [Sessions]
      summary: Close and destroy a session
      description: |
        Tears down the session and closes the underlying gvmd connection.
        The token is invalidated immediately.
      responses:
        "204":
          description: Session closed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

