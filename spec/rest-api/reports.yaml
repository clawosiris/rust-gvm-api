openapi: 3.1.0

paths:
  /reports:
    get:
      operationId: getReports
      tags: [Reports]
      summary: List reports
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /reports/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getReport
      tags: [Reports]
      summary: Get a report
      parameters:
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Report details with embedded results from the requested embedded-result page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    delete:
      operationId: deleteReport
      tags: [Reports]
      summary: Delete a report
      description: Deletes a report. Pass `ultimate=true` to request permanent backend deletion instead of the default non-ultimate delete.
      parameters:
        - $ref: "./common.yaml#/components/parameters/UltimateDelete"
      responses:
        "204":
          description: Report deleted
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /reports/{id}/results:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getReportResults
      tags: [Reports]
      summary: Get paginated results for a report
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of results
          content:
            application/json:
              schema:
                $ref: "./results.yaml#/components/schemas/ResultList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /reports/{id}/vulnerabilities:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getReportVulnerabilities
      tags: [Reports]
      summary: Get vulnerability findings for a report
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of aggregate vulnerability findings. Aggregate rows expose `hostsCount` and `occurrences` when supplied by gvmd and omit singular `host` and `port` when no single observation exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportVulnerabilityList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "501":
          $ref: "./common.yaml#/components/responses/NotImplemented"

  /reports/{id}/tls-certificates:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getReportTlsCertificates
      tags: [Reports]
      summary: Get TLS certificates observed in a report
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of TLS certificates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsCertificateList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "501":
          $ref: "./common.yaml#/components/responses/NotImplemented"

  /reports/{id}/errors:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getReportErrors
      tags: [Reports]
      summary: Get report error findings
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of report errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportErrorList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "501":
          $ref: "./common.yaml#/components/responses/NotImplemented"

  /reports/{id}/closed-cves:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getReportClosedCves
      tags: [Reports]
      summary: Get closed CVE findings for a report
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of closed CVE findings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportClosedCveList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "501":
          $ref: "./common.yaml#/components/responses/NotImplemented"

  /reports/{id}/hosts:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getReportHosts
      tags: [Reports]
      summary: Get report hosts
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of report host summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportHostList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "501":
          $ref: "./common.yaml#/components/responses/NotImplemented"

  /reports/{id}/ports:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getReportPorts
      tags: [Reports]
      summary: Get report ports
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of report port summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPortList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "501":
          $ref: "./common.yaml#/components/responses/NotImplemented"

  /reports/{id}/applications:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getReportApplications
      tags: [Reports]
      summary: Get report applications
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of report application summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportApplicationList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "501":
          $ref: "./common.yaml#/components/responses/NotImplemented"

  /reports/{id}/operating-systems:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getReportOperatingSystems
      tags: [Reports]
      summary: Get report operating systems
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of report operating-system summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportOperatingSystemList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "501":
          $ref: "./common.yaml#/components/responses/NotImplemented"

  /reports/{id}/cves:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getReportCves
      tags: [Reports]
      summary: Get report CVEs
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of report CVE summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportCveList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "501":
          $ref: "./common.yaml#/components/responses/NotImplemented"

components:
  schemas:
    Report:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
        task:
          $ref: "./common.yaml#/components/schemas/ResourceRef"
        scanStart:
          type: string
          format: date-time
        scanEnd:
          type: string
          format: date-time
        severity:
          type: number
          format: double
          description: Highest severity found in the report.
        resultCount:
          $ref: "#/components/schemas/ResultCount"
        results:
          type: array
          maxItems: 1000
          items:
            $ref: "./results.yaml#/components/schemas/Result"
          description: Embedded results from the requested page when fetching a single report.

    ResultCount:
      type: object
      properties:
        total:
          type: integer
        high:
          type: integer
        medium:
          type: integer
        low:
          type: integer
        log:
          type: integer
        debug:
          type: integer
        falsePositive:
          type: integer

    ReportList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Report"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    ReportVulnerability:
      type: object
      properties:
        id:
          type: string
        nvt:
          $ref: "./results.yaml#/components/schemas/NvtRef"
        host:
          type: string
        port:
          type: string
        severity:
          type: number
          format: double
        threat:
          type: string
          enum:
            - High
            - Medium
            - Low
            - Log
            - Alarm
        hostsCount:
          type: integer
        occurrences:
          type: integer

    ReportVulnerabilityList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ReportVulnerability"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    ReportError:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        host:
          type: string
        port:
          type: string
        description:
          type: string
        nvtName:
          type: string

    ReportErrorList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ReportError"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    ReportClosedCve:
      type: object
      properties:
        id:
          type: string
        nvt:
          $ref: "./results.yaml#/components/schemas/NvtRef"
        cve:
          type: string
        host:
          type: string
        severity:
          type: number
          format: double
        threat:
          type: string
          enum:
            - High
            - Medium
            - Low
            - Log
            - Alarm

    ReportClosedCveList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ReportClosedCve"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    TlsCertificate:
      type: object
      required:
        - subject
      properties:
        id:
          type: string
          description: Backend certificate or observation identifier when available.
        host:
          type: string
          description: Host associated with the certificate observation.
        port:
          type: string
          description: Port associated with the certificate observation.
        subject:
          type: string
          description: Certificate subject distinguished name.
        issuer:
          type: string
          description: Certificate issuer distinguished name.
        notBefore:
          type: string
          format: date-time
          description: Certificate validity start.
        notAfter:
          type: string
          format: date-time
          description: Certificate validity end.
        fingerprintSha256:
          type: string
          description: SHA-256 fingerprint of the certificate.

    TlsCertificateList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/TlsCertificate"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    ReportHost:
      type: object
      properties:
        id:
          type: string
          description: Backend row identifier when available.
        name:
          type: string
          description: Host label from the report summary row.
        severity:
          type: string
          description: Backend severity summary for the host row.

    ReportHostList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ReportHost"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    ReportPort:
      type: object
      properties:
        id:
          type: string
          description: Backend row identifier when available.
        name:
          type: string
          description: Port label from the report summary row.
        severity:
          type: string
          description: Backend severity summary for the port row.

    ReportPortList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ReportPort"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    ReportApplication:
      type: object
      properties:
        id:
          type: string
          description: Backend row identifier when available.
        name:
          type: string
          description: Application label from the report summary row.
        severity:
          type: string
          description: Backend severity summary for the application row.

    ReportApplicationList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ReportApplication"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    ReportOperatingSystem:
      type: object
      properties:
        id:
          type: string
          description: Backend row identifier when available.
        name:
          type: string
          description: Operating-system label from the report summary row.
        severity:
          type: string
          description: Backend severity summary for the operating-system row.

    ReportOperatingSystemList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ReportOperatingSystem"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    ReportCve:
      type: object
      properties:
        id:
          type: string
          description: Backend row identifier when available.
        name:
          type: string
          description: CVE label from the report summary row.
        severity:
          type: string
          description: Backend severity summary for the CVE row.

    ReportCveList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ReportCve"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"
