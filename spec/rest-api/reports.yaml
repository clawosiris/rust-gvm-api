openapi: 3.1.0

paths:
  /reports:
    get:
      operationId: getReports
      tags: [Reports]
      summary: List reports
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /reports/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getReport
      tags: [Reports]
      summary: Get a report
      parameters:
        - name: ignorePagination
          in: query
          schema:
            type: boolean
            default: false
          description: If true, return all embedded results without pagination.
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Report details with embedded results from the requested embedded-result window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    delete:
      operationId: deleteReport
      tags: [Reports]
      summary: Delete a report
      description: Deletes a report. Pass `ultimate=true` to request permanent backend deletion instead of the default non-ultimate delete.
      parameters:
        - $ref: "./common.yaml#/components/parameters/UltimateDelete"
      responses:
        "204":
          description: Report deleted
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /reports/{id}/export:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: exportReport
      tags: [Reports]
      summary: Export a report in a selected report format
      parameters:
        - name: reportFormatId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the report format used to render the exported artifact.
      responses:
        "200":
          description: |
            Rendered report bytes for the selected report format. The concrete
            `Content-Type` should follow the chosen report format metadata when
            known; `application/octet-stream` is the fallback for unknown or
            backend-specific media types.
          headers:
            traceparent:
              $ref: "./common.yaml#/components/headers/Traceparent"
            Content-Disposition:
              description: Attachment-style filename for the rendered report artifact.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/xml:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "504":
          $ref: "./common.yaml#/components/responses/GatewayTimeout"

  /reports/{id}/results:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getReportResults
      tags: [Reports]
      summary: Get paginated results for a report
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of results
          content:
            application/json:
              schema:
                $ref: "./results.yaml#/components/schemas/ResultList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /reports/{id}/vulnerabilities:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getReportVulnerabilities
      tags: [Reports]
      summary: Get vulnerability findings for a report
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of vulnerability findings
          content:
            application/json:
              schema:
                $ref: "./results.yaml#/components/schemas/ResultList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "501":
          $ref: "./common.yaml#/components/responses/NotImplemented"

  /reports/{id}/tls-certificates:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getReportTlsCertificates
      tags: [Reports]
      summary: Get TLS certificates observed in a report
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of TLS certificates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsCertificateList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "501":
          $ref: "./common.yaml#/components/responses/NotImplemented"

  /reports/{id}/errors:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getReportErrors
      tags: [Reports]
      summary: Get report error findings
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of report errors
          content:
            application/json:
              schema:
                $ref: "./results.yaml#/components/schemas/ResultList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "501":
          $ref: "./common.yaml#/components/responses/NotImplemented"

  /reports/{id}/closed-cves:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getReportClosedCves
      tags: [Reports]
      summary: Get closed CVE findings for a report
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of closed CVE findings
          content:
            application/json:
              schema:
                $ref: "./results.yaml#/components/schemas/ResultList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "501":
          $ref: "./common.yaml#/components/responses/NotImplemented"

components:
  schemas:
    Report:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
        task:
          $ref: "./common.yaml#/components/schemas/ResourceRef"
        scanStart:
          type: string
          format: date-time
        scanEnd:
          type: string
          format: date-time
        severity:
          type: number
          format: double
          description: Highest severity found in the report.
        resultCount:
          $ref: "#/components/schemas/ResultCount"
        results:
          type: array
          items:
            $ref: "./results.yaml#/components/schemas/Result"
          description: Embedded results (when fetching a single report).

    ResultCount:
      type: object
      properties:
        total:
          type: integer
        high:
          type: integer
        medium:
          type: integer
        low:
          type: integer
        log:
          type: integer
        debug:
          type: integer
        falsePositive:
          type: integer

    ReportList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    TlsCertificate:
      type: object
      required:
        - subject
      properties:
        id:
          type: string
          description: Backend certificate or observation identifier when available.
        host:
          type: string
          description: Host associated with the certificate observation.
        port:
          type: string
          description: Port associated with the certificate observation.
        subject:
          type: string
          description: Certificate subject distinguished name.
        issuer:
          type: string
          description: Certificate issuer distinguished name.
        notBefore:
          type: string
          format: date-time
          description: Certificate validity start.
        notAfter:
          type: string
          format: date-time
          description: Certificate validity end.
        fingerprintSha256:
          type: string
          description: SHA-256 fingerprint of the certificate.

    TlsCertificateList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TlsCertificate"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"
