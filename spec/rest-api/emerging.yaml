openapi: 3.1.0

paths:
  /agents:
    get:
      operationId: getAgents
      tags: [Agents]
      summary: Paginated list of agents
      parameters: &agentListParameters
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200": { description: Paginated list of agents, content: { application/json: { schema: { $ref: "#/components/schemas/AgentList" } } } }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "501": { $ref: "./common.yaml#/components/responses/NotImplemented" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
        "504": { $ref: "./common.yaml#/components/responses/GatewayTimeout" }
  /agents/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getAgent
      tags: [Agents]
      summary: Agent details
      responses:
        "200": { description: Agent details, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }
        "501": { $ref: "./common.yaml#/components/responses/NotImplemented" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
        "504": { $ref: "./common.yaml#/components/responses/GatewayTimeout" }
    put:
      operationId: modifyAgent
      tags: [Agents]
      summary: Updated agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModifyAgent" }
      responses:
        "200": { description: Updated agent, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }
        "409": { $ref: "./common.yaml#/components/responses/Conflict" }
        "501": { $ref: "./common.yaml#/components/responses/NotImplemented" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
        "504": { $ref: "./common.yaml#/components/responses/GatewayTimeout" }
    delete:
      operationId: deleteAgent
      tags: [Agents]
      summary: Agent deleted
      responses:
        "204": { description: Agent deleted }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "./common.yaml#/components/responses/Forbidden" }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }
        "409": { $ref: "./common.yaml#/components/responses/Conflict" }
        "501": { $ref: "./common.yaml#/components/responses/NotImplemented" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
        "504": { $ref: "./common.yaml#/components/responses/GatewayTimeout" }
  /agents/sync:
    post:
      operationId: syncAgents
      tags: [Agents]
      summary: Agent synchronization started
      responses:
        "204": { description: Agent synchronization started }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "501": { $ref: "./common.yaml#/components/responses/NotImplemented" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
        "504": { $ref: "./common.yaml#/components/responses/GatewayTimeout" }
  /agents/{id}/support-bundle:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
      - name: days
        in: query
        required: false
        schema: { type: integer, minimum: 1 }
        description: Limit the support bundle to the most recent number of days.
    get:
      operationId: getAgentSupportBundle
      tags: [Agents]
      summary: Get an agent support bundle
      responses:
        "200":
          description: Agent support bundle download
          headers:
            Content-Disposition:
              description: Attachment-style filename for the support bundle.
              schema: { type: string }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
            application/gzip: { schema: { type: string, format: binary } }
            application/zip: { schema: { type: string, format: binary } }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }
        "501": { $ref: "./common.yaml#/components/responses/NotImplemented" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
        "504": { $ref: "./common.yaml#/components/responses/GatewayTimeout" }
  /agent-control-scan-configs/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    put:
      operationId: modifyAgentControlScanConfig
      tags: [Agents]
      summary: Modify agent-control scan config defaults
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModifyAgentControlScanConfig" }
      responses:
        "204": { description: Agent-control scan config defaults updated }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }
        "501": { $ref: "./common.yaml#/components/responses/NotImplemented" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
        "504": { $ref: "./common.yaml#/components/responses/GatewayTimeout" }
  /scanners/{id}/agent-installer-instruction:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
      - name: originUrl
        in: query
        required: true
        schema: { type: string, format: uri }
        description: Absolute origin URL used to generate installer instructions.
      - name: language
        in: query
        required: false
        schema: { type: string, default: en }
        description: Requested installer-instruction language. Supported values are `en` and `de`.
    get:
      operationId: getAgentInstallerInstruction
      tags: [Agents]
      summary: Get agent installer instructions
      responses:
        "200": { description: Agent installer instructions, content: { application/json: { schema: { $ref: "#/components/schemas/AgentInstallerInstruction" } } } }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }
        "501": { $ref: "./common.yaml#/components/responses/NotImplemented" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
        "504": { $ref: "./common.yaml#/components/responses/GatewayTimeout" }

  /agent-groups:
    get:
      operationId: getAgentGroups
      tags: [Agent Groups]
      summary: Paginated list of agent groups
      parameters: &agentGroupListParameters
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - name: trash
          in: query
          required: false
          schema: { type: boolean, default: false }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200": { description: Paginated list of agent groups, content: { application/json: { schema: { $ref: "#/components/schemas/AgentGroupList" } } } }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "501": { $ref: "./common.yaml#/components/responses/NotImplemented" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
        "504": { $ref: "./common.yaml#/components/responses/GatewayTimeout" }
    post:
      operationId: createAgentGroup
      tags: [Agent Groups]
      summary: Agent group created
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentGroup" }
      responses: &agentGroupCreatedResponses
        "201":
          description: Agent group created
          headers:
            Location: { $ref: "./common.yaml#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "./common.yaml#/components/schemas/ResourceCreated" }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "409": { $ref: "./common.yaml#/components/responses/Conflict" }
        "501": { $ref: "./common.yaml#/components/responses/NotImplemented" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
        "504": { $ref: "./common.yaml#/components/responses/GatewayTimeout" }
  /agent-groups/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getAgentGroup
      tags: [Agent Groups]
      summary: Agent group details
      responses:
        "200": { description: Agent group details, content: { application/json: { schema: { $ref: "#/components/schemas/AgentGroup" } } } }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }
        "501": { $ref: "./common.yaml#/components/responses/NotImplemented" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
        "504": { $ref: "./common.yaml#/components/responses/GatewayTimeout" }
    put:
      operationId: modifyAgentGroup
      tags: [Agent Groups]
      summary: Updated agent group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModifyAgentGroup" }
      responses:
        "200": { description: Updated agent group, content: { application/json: { schema: { $ref: "#/components/schemas/AgentGroup" } } } }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }
        "409": { $ref: "./common.yaml#/components/responses/Conflict" }
        "501": { $ref: "./common.yaml#/components/responses/NotImplemented" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
        "504": { $ref: "./common.yaml#/components/responses/GatewayTimeout" }
    delete:
      operationId: deleteAgentGroup
      tags: [Agent Groups]
      summary: Agent group deleted
      parameters:
        - $ref: "./common.yaml#/components/parameters/UltimateDelete"
      responses:
        "204": { description: Agent group deleted }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "./common.yaml#/components/responses/Forbidden" }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }
        "409": { $ref: "./common.yaml#/components/responses/Conflict" }
        "501": { $ref: "./common.yaml#/components/responses/NotImplemented" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
        "504": { $ref: "./common.yaml#/components/responses/GatewayTimeout" }
  /agent-groups/{id}/clone:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    post:
      operationId: cloneAgentGroup
      tags: [Agent Groups]
      summary: Clone an agent group
      responses:
        "201":
          description: Agent group clone created
          headers:
            Location: { $ref: "./common.yaml#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "./common.yaml#/components/schemas/ResourceCreated" }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }
        "409": { $ref: "./common.yaml#/components/responses/Conflict" }
        "501": { $ref: "./common.yaml#/components/responses/NotImplemented" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
        "504": { $ref: "./common.yaml#/components/responses/GatewayTimeout" }

  /assets:
    get: { operationId: getAssets, tags: [Assets], summary: List generic assets, responses: { "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }, "502": { $ref: "./common.yaml#/components/responses/BadGateway" }, "501": { $ref: "./common.yaml#/components/responses/NotImplemented" } } }
    post: { operationId: createAsset, tags: [Assets], summary: Create a generic asset, responses: { "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }, "502": { $ref: "./common.yaml#/components/responses/BadGateway" }, "501": { $ref: "./common.yaml#/components/responses/NotImplemented" } } }
  /assets/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get: { operationId: getAsset, tags: [Assets], summary: Get a generic asset, responses: { "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }, "502": { $ref: "./common.yaml#/components/responses/BadGateway" }, "501": { $ref: "./common.yaml#/components/responses/NotImplemented" } } }
    put: { operationId: modifyAsset, tags: [Assets], summary: Modify a generic asset, responses: { "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }, "502": { $ref: "./common.yaml#/components/responses/BadGateway" }, "501": { $ref: "./common.yaml#/components/responses/NotImplemented" } } }
    delete: { operationId: deleteAsset, tags: [Assets], summary: Delete a generic asset, responses: { "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }, "502": { $ref: "./common.yaml#/components/responses/BadGateway" }, "501": { $ref: "./common.yaml#/components/responses/NotImplemented" } } }

  /configs:
    get: { operationId: getConfigs, tags: [Configs], summary: List generic configs, responses: { "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }, "502": { $ref: "./common.yaml#/components/responses/BadGateway" }, "501": { $ref: "./common.yaml#/components/responses/NotImplemented" } } }
    post: { operationId: createConfig, tags: [Configs], summary: Create a generic config, responses: { "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }, "502": { $ref: "./common.yaml#/components/responses/BadGateway" }, "501": { $ref: "./common.yaml#/components/responses/NotImplemented" } } }
  /configs/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get: { operationId: getConfig, tags: [Configs], summary: Get a generic config, responses: { "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }, "502": { $ref: "./common.yaml#/components/responses/BadGateway" }, "501": { $ref: "./common.yaml#/components/responses/NotImplemented" } } }
    put: { operationId: modifyConfig, tags: [Configs], summary: Modify a generic config, responses: { "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }, "502": { $ref: "./common.yaml#/components/responses/BadGateway" }, "501": { $ref: "./common.yaml#/components/responses/NotImplemented" } } }
    delete: { operationId: deleteConfig, tags: [Configs], summary: Delete a generic config, responses: { "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }, "502": { $ref: "./common.yaml#/components/responses/BadGateway" }, "501": { $ref: "./common.yaml#/components/responses/NotImplemented" } } }
  /configs/{id}/clone:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    post: { operationId: cloneConfig, tags: [Configs], summary: Clone a generic config, responses: { "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }, "502": { $ref: "./common.yaml#/components/responses/BadGateway" }, "501": { $ref: "./common.yaml#/components/responses/NotImplemented" } } }

  /oci-image-targets:
    get:
      operationId: getOciImageTargets
      tags: [OCI Image Targets]
      summary: List OCI image targets
      parameters: &specializedTargetListParameters
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - name: trash
          in: query
          schema: { type: boolean, default: false }
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200": { description: Paginated OCI image targets, content: { application/json: { schema: { $ref: "#/components/schemas/OciImageTargetList" } } } }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
    post:
      operationId: createOciImageTarget
      tags: [OCI Image Targets]
      summary: Create an OCI image target
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateOciImageTarget" } } } }
      responses:
        "201": &specializedTargetCreated { description: Target created, headers: { Location: { $ref: "./common.yaml#/components/headers/Location" } }, content: { application/json: { schema: { $ref: "./common.yaml#/components/schemas/ResourceCreated" } } } }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "409": { $ref: "./common.yaml#/components/responses/Conflict" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
  /oci-image-targets/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getOciImageTarget
      tags: [OCI Image Targets]
      summary: Get an OCI image target
      responses:
        "200": { description: OCI image target, content: { application/json: { schema: { $ref: "#/components/schemas/OciImageTarget" } } } }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
    put:
      operationId: modifyOciImageTarget
      tags: [OCI Image Targets]
      summary: Modify an OCI image target
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModifyOciImageTarget" } } } }
      responses:
        "200": { description: Updated OCI image target, content: { application/json: { schema: { $ref: "#/components/schemas/OciImageTarget" } } } }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }
        "409": { $ref: "./common.yaml#/components/responses/Conflict" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
    delete:
      operationId: deleteOciImageTarget
      tags: [OCI Image Targets]
      summary: Delete an OCI image target
      parameters: [{ $ref: "./common.yaml#/components/parameters/UltimateDelete" }]
      responses: &specializedTargetDeleteResponses
        "204": { description: Target deleted }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "./common.yaml#/components/responses/Forbidden" }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }
        "409": { $ref: "./common.yaml#/components/responses/Conflict" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
  /oci-image-targets/{id}/clone:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    post:
      operationId: cloneOciImageTarget
      tags: [OCI Image Targets]
      summary: Clone an OCI image target
      responses:
        "201": *specializedTargetCreated
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }
        "409": { $ref: "./common.yaml#/components/responses/Conflict" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }

  /web-application-targets:
    get:
      operationId: getWebApplicationTargets
      tags: [Web Application Targets]
      summary: List web application targets
      parameters: *specializedTargetListParameters
      responses:
        "200": { description: Paginated web application targets, content: { application/json: { schema: { $ref: "#/components/schemas/WebApplicationTargetList" } } } }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
    post:
      operationId: createWebApplicationTarget
      tags: [Web Application Targets]
      summary: Create a web application target
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateWebApplicationTarget" } } } }
      responses:
        "201": *specializedTargetCreated
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "409": { $ref: "./common.yaml#/components/responses/Conflict" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
  /web-application-targets/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getWebApplicationTarget
      tags: [Web Application Targets]
      summary: Get a web application target
      responses:
        "200": { description: Web application target, content: { application/json: { schema: { $ref: "#/components/schemas/WebApplicationTarget" } } } }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
    put:
      operationId: modifyWebApplicationTarget
      tags: [Web Application Targets]
      summary: Modify a web application target
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModifyWebApplicationTarget" } } } }
      responses:
        "200": { description: Updated web application target, content: { application/json: { schema: { $ref: "#/components/schemas/WebApplicationTarget" } } } }
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }
        "409": { $ref: "./common.yaml#/components/responses/Conflict" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }
    delete:
      operationId: deleteWebApplicationTarget
      tags: [Web Application Targets]
      summary: Delete a web application target
      parameters: [{ $ref: "./common.yaml#/components/parameters/UltimateDelete" }]
      responses: *specializedTargetDeleteResponses
  /web-application-targets/{id}/clone:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    post:
      operationId: cloneWebApplicationTarget
      tags: [Web Application Targets]
      summary: Clone a web application target
      responses:
        "201": *specializedTargetCreated
        "400": { $ref: "./common.yaml#/components/responses/BadRequest" }
        "401": { $ref: "./common.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "./common.yaml#/components/responses/NotFound" }
        "409": { $ref: "./common.yaml#/components/responses/Conflict" }
        "502": { $ref: "./common.yaml#/components/responses/BadGateway" }

  /reports/{id}/hosts:
