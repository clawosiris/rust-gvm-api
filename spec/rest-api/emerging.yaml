components:
  schemas:
    AssetType:
      type: string
      enum: [host, os, tls_certificate]
      description: Known values are listed for documentation and client generation. This list is not exhaustive; unknown future values may also be returned verbatim, and clients must preserve them.
    ConfigUsageType:
      type: string
      enum: [scan, audit, policy]
      description: Known values are listed for documentation and client generation. This list is not exhaustive; unknown future values may also be returned verbatim, and clients must preserve them.
    AssetIdentifier:
      type: object
      properties:
        name: { type: string }
        value: { type: string }
        source: { type: string }
    AssetHost:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        severity: { type: string }
    GenericAsset:
      type: object
      required: [id, name, writable, inUse, type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        comment: { type: string }
        creationTime: { type: string }
        modificationTime: { type: string }
        writable: { type: boolean }
        inUse: { type: boolean }
        type: { $ref: "#/components/schemas/AssetType" }
        value: { type: string }
        identifiers: { type: array, items: { $ref: "#/components/schemas/AssetIdentifier" } }
        severity: { type: string }
        ip: { type: string }
        hostname: { type: string }
        os: { type: string }
        hostsCount: { type: integer, format: uint32, minimum: 0 }
        title: { type: string }
        installs: { type: integer, format: uint32, minimum: 0 }
        allInstalls: { type: integer, format: uint32, minimum: 0 }
        latestSeverity: { type: string }
        highestSeverity: { type: string }
        averageSeverity: { type: string }
        hostCount: { type: integer, format: uint32, minimum: 0 }
        hosts: { type: array, items: { $ref: "#/components/schemas/AssetHost" } }
    GenericAssetList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/GenericAsset" } }
        pagination: { $ref: "./common.yaml#/components/schemas/Pagination" }
    ModifyGenericAsset:
      type: object
      description: Comment-only mutation supported by typed gvmd generic assets.
      properties:
        comment: { type: string }
      additionalProperties: false
    GenericConfig:
      type: object
      required: [id, name, usageType, inUse, writable]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        comment: { type: string }
        type: { type: integer, format: uint32, minimum: 0 }
        usageType: { $ref: "#/components/schemas/ConfigUsageType" }
        inUse: { type: boolean }
        writable: { type: boolean }
    GenericConfigList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/GenericConfig" } }
        pagination: { $ref: "./common.yaml#/components/schemas/Pagination" }
    AgentRetryConfig:
      type: object
      properties:
        attempts: { type: integer, minimum: 0 }
        delayInSeconds: { type: integer, minimum: 0 }
        maxJitterInSeconds: { type: integer, minimum: 0 }
    AgentControlConfig:
      type: object
      properties:
        retry: { $ref: "#/components/schemas/AgentRetryConfig" }
    AgentScriptExecutorConfig:
      type: object
      properties:
        bulkSize: { type: integer, minimum: 0 }
        bulkThrottleTimeInMs: { type: integer, minimum: 0 }
        indexerDirDepth: { type: integer, minimum: 0 }
        schedulerCronTime:
          type: array
          items: { type: string }
    AgentHeartbeatConfig:
      type: object
      properties:
        intervalInSeconds: { type: integer, minimum: 0 }
        missUntilInactive: { type: integer, minimum: 0 }
    AgentConfig:
      type: object
      properties:
        agentControl: { $ref: "#/components/schemas/AgentControlConfig" }
        agentScriptExecutor: { $ref: "#/components/schemas/AgentScriptExecutorConfig" }
        heartbeat: { $ref: "#/components/schemas/AgentHeartbeatConfig" }
    Agent:
      type: object
      required: [id, name, writable, inUse]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        comment: { type: string }
        creationTime: { type: string }
        modificationTime: { type: string }
        writable: { type: boolean }
        inUse: { type: boolean }
        authorized: { type: boolean }
        updateToLatest: { type: boolean }
        status: { type: string }
        version: { type: string }
        lastUpdateTime: { type: string }
        lastContactTime: { type: string }
        scanner: { $ref: "./common.yaml#/components/schemas/ResourceRef" }
        config: { $ref: "#/components/schemas/AgentConfig" }
    AgentList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Agent" }
        pagination: { $ref: "./common.yaml#/components/schemas/Pagination" }
    AgentConfigUpdate:
      type: object
      properties:
        agentControl: { $ref: "#/components/schemas/AgentControlConfigUpdate" }
        agentScriptExecutor: { $ref: "#/components/schemas/AgentScriptExecutorConfigUpdate" }
        heartbeat: { $ref: "#/components/schemas/AgentHeartbeatConfigUpdate" }
    AgentControlConfigUpdate:
      type: object
      properties:
        retry: { $ref: "#/components/schemas/AgentRetryConfigUpdate" }
    AgentRetryConfigUpdate:
      type: object
      properties:
        attempts: { type: integer, minimum: 0 }
        delayInSeconds: { type: integer, minimum: 0 }
        maxJitterInSeconds: { type: integer, minimum: 0 }
    AgentScriptExecutorConfigUpdate:
      type: object
      properties:
        bulkSize: { type: integer, minimum: 0 }
        bulkThrottleTimeInMs: { type: integer, minimum: 0 }
        indexerDirDepth: { type: integer, minimum: 0 }
        schedulerCronTime:
          type: array
          items: { type: string }
    AgentHeartbeatConfigUpdate:
      type: object
      properties:
        intervalInSeconds: { type: integer, minimum: 0 }
        missUntilInactive: { type: integer, minimum: 0 }
    ModifyAgent:
      type: object
      properties:
        authorized: { type: boolean }
        updateToLatest: { type: boolean }
        comment: { type: string }
        config: { $ref: "#/components/schemas/AgentConfigUpdate" }
    ModifyAgentControlScanConfig:
      type: object
      properties:
        agentDefaults: { $ref: "#/components/schemas/AgentConfigUpdate" }
        updateToLatest: { type: boolean }
    AgentInstallerInstruction:
      type: object
      required: [language, instruction]
      properties:
        language: { type: string }
        instruction: { type: string }
    AgentGroup:
      type: object
      required: [id, name, writable, inUse]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        comment: { type: string }
        creationTime: { type: string }
        modificationTime: { type: string }
        writable: { type: boolean }
        inUse: { type: boolean }
        schedulerCronTime: { type: string }
        agents:
          type: array
          items: { $ref: "./common.yaml#/components/schemas/ResourceRef" }
    AgentGroupList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AgentGroup" }
        pagination: { $ref: "./common.yaml#/components/schemas/Pagination" }
    CreateAgentGroup:
      type: object
      required: [name, schedulerCronTime]
      properties:
        name: { type: string }
        schedulerCronTime: { type: string }
        comment: { type: string }
        agentIds:
          type: array
          items: { type: string, format: uuid }
    ModifyAgentGroup:
      type: object
      required: [schedulerCronTime]
      properties:
        schedulerCronTime: { type: string }
        name: { type: string }
        comment: { type: string }
        agentIds:
          type: array
          items: { type: string, format: uuid }
    OciImageTarget:
      type: object
      required: [id, name, imageReferences, tasks, inUse, writable]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        comment: { type: string }
        imageReferences: { type: array, items: { type: string } }
        credential: { $ref: "./common.yaml#/components/schemas/ResourceRef" }
        tasks: { type: array, items: { $ref: "./common.yaml#/components/schemas/ResourceRef" } }
        inUse: { type: boolean }
        writable: { type: boolean }
    OciImageTargetList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/OciImageTarget" } }
        pagination: { $ref: "./common.yaml#/components/schemas/Pagination" }
    CreateOciImageTarget:
      type: object
      required: [name, imageReferences]
      properties:
        name: { type: string }
        comment: { type: string }
        imageReferences: { type: array, minItems: 1, items: { type: string } }
        credentialId: { type: string, format: uuid }
    ModifyOciImageTarget:
      type: object
      properties:
        name: { type: string }
        comment: { type: string }
        imageReferences: { type: array, minItems: 1, items: { type: string } }
        credentialId: { type: string, format: uuid }
    WebApplicationTarget:
      type: object
      required: [id, name, urls, excludeUrls, tasks, inUse, writable]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        comment: { type: string }
        urls: { type: array, items: { type: string, format: uri } }
        excludeUrls: { type: array, items: { type: string, format: uri } }
        credential: { $ref: "./common.yaml#/components/schemas/ResourceRef" }
        tasks: { type: array, items: { $ref: "./common.yaml#/components/schemas/ResourceRef" } }
        inUse: { type: boolean }
        writable: { type: boolean }
    WebApplicationTargetList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/WebApplicationTarget" } }
        pagination: { $ref: "./common.yaml#/components/schemas/Pagination" }
    CreateWebApplicationTarget:
      type: object
      required: [name, urls]
      properties:
        name: { type: string }
        comment: { type: string }
        urls: { type: array, minItems: 1, items: { type: string, format: uri } }
        excludeUrls: { type: array, items: { type: string, format: uri } }
        credentialId: { type: string, format: uuid }
    ModifyWebApplicationTarget:
      type: object
      properties:
        name: { type: string }
        comment: { type: string }
        urls: { type: array, minItems: 1, items: { type: string, format: uri } }
        excludeUrls: { type: array, items: { type: string, format: uri } }
        credentialId: { type: string, format: uuid }
