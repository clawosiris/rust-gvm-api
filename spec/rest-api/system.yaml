openapi: 3.1.0

paths:
  /health:
    servers:
      - url: /
        description: Root path for unversioned liveness and readiness probes
    get:
      operationId: getHealth
      tags: [System]
      summary: Liveness probe
      description: Returns basic process liveness information.
      security: []
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"

  /ready:
    servers:
      - url: /
        description: Root path for unversioned liveness and readiness probes
    get:
      operationId: getReadiness
      tags: [System]
      summary: Readiness probe
      description: Indicates whether the service is ready to handle requests.
      security: []
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /version:
    get:
      operationId: getVersion
      tags: [System]
      summary: Get proxied gvmd version information
      description: Returns the GMP protocol version reported by the proxied gvmd. The `apiVersion` field identifies the REST API contract version, not the proxy binary version.
      security: []
      responses:
        "200":
          description: Proxied gvmd version information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /timezones:
    get:
      operationId: getTimezones
      tags: [System]
      summary: List backend timezones
      description: >-
        Returns the timezones known to the proxied gvmd backend. The catalog is
        sourced from the connected backend rather than the gateway host's local
        timezone database.
      responses:
        "200":
          description: Backend timezones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimezoneList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "501":
          $ref: "./common.yaml#/components/responses/NotImplemented"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /openapi.json:
    get:
      operationId: getOpenApiDocument
      tags: [System]
      summary: Get generated OpenAPI document
      description: Returns the generated OpenAPI document for the implemented REST surface.
      security: []
      responses:
        "200":
          description: Generated OpenAPI document
          content:
            application/json:
              schema:
                type: object

components:
  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]
          description: Liveness state.

    ReadinessStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ready, notReady]
          description: Readiness state.
        reason:
          type: string
          description: Optional human-readable reason when not ready.

    VersionInfo:
      type: object
      required:
        - apiVersion
        - gmpVersion
      properties:
        apiVersion:
          type: string
          description: REST API contract version, not the proxy binary version.
          examples:
            - "0.1.0"
        gmpVersion:
          type: string
          description: GMP protocol version reported by the proxied gvmd.
          examples:
            - "22.7"

    Timezone:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: IANA timezone name reported by gvmd.
        offset:
          type: string
          description: Optional UTC offset reported by gvmd.

    TimezoneList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Timezone"
