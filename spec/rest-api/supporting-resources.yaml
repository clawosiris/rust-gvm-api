openapi: 3.1.0

paths:
  /hosts:
    get:
      operationId: getHosts
      tags: [Hosts]
      summary: List hosts
      description: Returns a paginated list of discovered hosts/assets.
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of discovered hosts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
    post:
      operationId: createHost
      tags: [Hosts]
      summary: Create a host
      description: Creates a host asset identified by a name or IP address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHost"
      responses:
        "201":
          description: Host created
          headers:
            Location:
              $ref: "./common.yaml#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/ResourceCreated"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /hosts/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getHost
      tags: [Hosts]
      summary: Get a host
      description: Returns the details for a single discovered host/asset.
      responses:
        "200":
          description: Host details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    put:
      operationId: modifyHost
      tags: [Hosts]
      summary: Modify a host
      description: >-
        Updates a host asset's comment. The gvmd `modify_asset` command does not
        change a host asset's name/IP value, so only the comment can be edited
        here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHost"
      responses:
        "200":
          description: Host updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    delete:
      operationId: deleteHost
      tags: [Hosts]
      summary: Delete a host
      description: >-
        Deletes a host asset. The gvmd host-asset delete command does not
        support the `ultimate` (permanent) flag, so this endpoint always
        performs a single delete.
      responses:
        "204":
          description: Host deleted
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /operating-systems:
    get:
      operationId: getOperatingSystems
      tags: [Operating Systems]
      summary: List operating systems
      description: Returns a paginated list of operating-system assets.
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of operating-system assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatingSystemList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /operating-systems/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getOperatingSystem
      tags: [Operating Systems]
      summary: Get an operating system
      description: Returns the details for a single operating-system asset.
      responses:
        "200":
          description: Operating-system details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatingSystem"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    put:
      operationId: modifyOperatingSystem
      tags: [Operating Systems]
      summary: Modify an operating system
      description: >-
        Updates an operating-system asset's comment. The typed gvmd command only
        supports comment updates for this resource.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOperatingSystem"
      responses:
        "200":
          description: Operating-system updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatingSystem"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    delete:
      operationId: deleteOperatingSystem
      tags: [Operating Systems]
      summary: Delete an operating system
      description: >-
        Deletes an operating-system asset. The typed gvmd delete command does
        not support the `ultimate` flag for this resource, so this endpoint
        always performs a single delete. Deleting an asset that is still in use
        returns `409 Conflict`.
      responses:
        "204":
          description: Operating-system deleted
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /tls-certificates:
    get:
      operationId: getTlsCertificates
      tags: [TLS Certificates]
      summary: List TLS certificates
      description: Returns a paginated list of TLS certificate assets.
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of TLS certificate assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsCertificateAssetList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /tls-certificates/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getTlsCertificate
      tags: [TLS Certificates]
      summary: Get a TLS certificate
      description: Returns the details for a single TLS certificate asset.
      responses:
        "200":
          description: TLS certificate details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsCertificateAsset"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /report-formats:
    get:
      operationId: getReportFormats
      tags: [Report Formats]
      summary: List report formats
      description: Returns a paginated list of report formats available for report export.
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of report formats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportFormatList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /report-formats/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getReportFormat
      tags: [Report Formats]
      summary: Get a report format
      description: Returns the details for a single report format.
      responses:
        "200":
          description: Report format details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportFormat"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /filters:
    get:
      operationId: getFilters
      tags: [Filters]
      summary: List filters
      description: Returns a paginated list of saved filters.
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of saved filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
    post:
      operationId: createFilter
      tags: [Filters]
      summary: Create a filter
      description: Creates a saved filter with an optional term, comment, and resource type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFilter"
      responses:
        "201":
          description: Filter created
          headers:
            Location:
              $ref: "./common.yaml#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/ResourceCreated"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /filters/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getFilter
      tags: [Filters]
      summary: Get a filter
      description: Returns the details for a single saved filter.
      responses:
        "200":
          description: Filter details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Filter"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    put:
      operationId: modifyFilter
      tags: [Filters]
      summary: Modify a filter
      description: Updates a saved filter's term, comment, or resource type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFilter"
      responses:
        "200":
          description: Filter updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Filter"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    delete:
      operationId: deleteFilter
      tags: [Filters]
      summary: Delete a filter
      description: Deletes a saved filter. Pass `ultimate=true` to request permanent backend deletion instead of the default non-ultimate delete.
      parameters:
        - $ref: "./common.yaml#/components/parameters/UltimateDelete"
      responses:
        "204":
          description: Filter deleted
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /filters/{id}/clone:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    post:
      operationId: cloneFilter
      tags: [Filters]
      summary: Clone a filter
      description: Creates a copy of an existing saved filter.
      responses:
        "201":
          description: Filter cloned
          headers:
            Location:
              $ref: "./common.yaml#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/ResourceCreated"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /tags:
    get:
      operationId: getTags
      tags: [Tags]
      summary: List tags
      description: Returns a paginated list of tags.
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
    post:
      operationId: createTag
      tags: [Tags]
      summary: Create a tag
      description: Creates a tag, optionally attaching it to a related resource by type and id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTag"
      responses:
        "201":
          description: Tag created
          headers:
            Location:
              $ref: "./common.yaml#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/ResourceCreated"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /tags/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getTag
      tags: [Tags]
      summary: Get a tag
      description: Returns the details for a single tag.
      responses:
        "200":
          description: Tag details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResource"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    put:
      operationId: modifyTag
      tags: [Tags]
      summary: Modify a tag
      description: Updates a tag's value, comment, resource attachment, or active state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTag"
      responses:
        "200":
          description: Tag updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResource"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    delete:
      operationId: deleteTag
      tags: [Tags]
      summary: Delete a tag
      description: Deletes a tag. Pass `ultimate=true` to request permanent backend deletion instead of the default non-ultimate delete.
      parameters:
        - $ref: "./common.yaml#/components/parameters/UltimateDelete"
      responses:
        "204":
          description: Tag deleted
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /tags/{id}/clone:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    post:
      operationId: cloneTag
      tags: [Tags]
      summary: Clone a tag
      description: Creates a copy of an existing tag.
      responses:
        "201":
          description: Tag cloned
          headers:
            Location:
              $ref: "./common.yaml#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/ResourceCreated"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /tickets:
    get:
      operationId: getTickets
      tags: [Tickets]
      summary: List tickets
      description: Returns a paginated list of tickets.
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of tickets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /tickets/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getTicket
      tags: [Tickets]
      summary: Get a ticket
      description: Returns the details for a single ticket.
      responses:
        "200":
          description: Ticket details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /notes:
    get:
      operationId: getNotes
      tags: [Notes]
      summary: List notes
      description: Returns a paginated list of notes that annotate findings. Filter expressions can scope notes to the related task, result, NVT, host, or port selectors exposed by each note.
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
    post:
      operationId: createNote
      tags: [Notes]
      summary: Create a note
      description: Creates a note that annotates findings for the selected NVT and optional task/result/host/port/severity scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNote"
      responses:
        "201":
          description: Note created
          headers:
            Location:
              $ref: "./common.yaml#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/ResourceCreated"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /notes/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getNote
      tags: [Notes]
      summary: Get a note
      description: Returns the details for a single note, including any related task/result identifiers and the NVT/host/port selectors the note annotates.
      responses:
        "200":
          description: Note details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    put:
      operationId: modifyNote
      tags: [Notes]
      summary: Modify a note
      description: Updates a note used for finding triage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNote"
      responses:
        "200":
          description: Note updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    delete:
      operationId: deleteNote
      tags: [Notes]
      summary: Delete a note
      description: Deletes a note. Pass `ultimate=true` to request permanent backend deletion instead of the default non-ultimate delete.
      parameters:
        - $ref: "./common.yaml#/components/parameters/UltimateDelete"
      responses:
        "204":
          description: Note deleted
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /overrides:
    get:
      operationId: getOverrides
      tags: [Overrides]
      summary: List overrides
      description: Returns a paginated list of overrides that change finding interpretation. Filter expressions can scope overrides to the related task, result, NVT, host, or port selectors exposed by each override.
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of overrides
          content:
