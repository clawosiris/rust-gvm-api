              schema:
                $ref: "#/components/schemas/OverrideList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
    post:
      operationId: createOverride
      tags: [Overrides]
      summary: Create an override
      description: Creates an override that changes finding interpretation for the selected NVT and optional task/result/host/port/severity scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOverride"
      responses:
        "201":
          description: Override created
          headers:
            Location:
              $ref: "./common.yaml#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/ResourceCreated"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

