openapi: 3.1.0

paths:
  /hosts:
    get:
      operationId: getHosts
      tags: [Hosts]
      summary: List hosts
      description: Returns a paginated list of discovered hosts/assets.
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of discovered hosts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /hosts/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getHost
      tags: [Hosts]
      summary: Get a host
      description: Returns the details for a single discovered host/asset.
      responses:
        "200":
          description: Host details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /report-formats:
    get:
      operationId: getReportFormats
      tags: [Report Formats]
      summary: List report formats
      description: Returns a paginated list of report formats available for report export.
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of report formats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportFormatList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /report-formats/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getReportFormat
      tags: [Report Formats]
      summary: Get a report format
      description: Returns the details for a single report format.
      responses:
        "200":
          description: Report format details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportFormat"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /filters:
    get:
      operationId: getFilters
      tags: [Filters]
      summary: List filters
      description: Returns a paginated list of saved filters.
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of saved filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /filters/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getFilter
      tags: [Filters]
      summary: Get a filter
      description: Returns the details for a single saved filter.
      responses:
        "200":
          description: Filter details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Filter"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /tags:
    get:
      operationId: getTags
      tags: [Tags]
      summary: List tags
      description: Returns a paginated list of tags.
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /tags/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getTag
      tags: [Tags]
      summary: Get a tag
      description: Returns the details for a single tag.
      responses:
        "200":
          description: Tag details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResource"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /tickets:
    get:
      operationId: getTickets
      tags: [Tickets]
      summary: List tickets
      description: Returns a paginated list of tickets.
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of tickets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /tickets/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getTicket
      tags: [Tickets]
      summary: Get a ticket
      description: Returns the details for a single ticket.
      responses:
        "200":
          description: Ticket details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /notes:
    get:
      operationId: getNotes
      tags: [Notes]
      summary: List notes
      description: Returns a paginated list of notes that annotate findings. Filter expressions can scope notes to the related task, result, NVT, host, or port selectors exposed by each note.
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
    post:
      operationId: createNote
      tags: [Notes]
      summary: Create a note
      description: Creates a note that annotates findings for the selected NVT and optional task/result/host/port/severity scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNote"
      responses:
        "201":
          description: Note created
          headers:
            Location:
              $ref: "./common.yaml#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/ResourceCreated"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /notes/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getNote
      tags: [Notes]
      summary: Get a note
      description: Returns the details for a single note, including any related task/result identifiers and the NVT/host/port selectors the note annotates.
      responses:
        "200":
          description: Note details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    put:
      operationId: modifyNote
      tags: [Notes]
      summary: Modify a note
      description: Updates a note used for finding triage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNote"
      responses:
        "200":
          description: Note updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    delete:
      operationId: deleteNote
      tags: [Notes]
      summary: Delete a note
      description: Deletes a note. Pass `ultimate=true` to request permanent backend deletion instead of the default non-ultimate delete.
      parameters:
        - $ref: "./common.yaml#/components/parameters/UltimateDelete"
      responses:
        "204":
          description: Note deleted
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /overrides:
    get:
      operationId: getOverrides
      tags: [Overrides]
      summary: List overrides
      description: Returns a paginated list of overrides that change finding interpretation. Filter expressions can scope overrides to the related task, result, NVT, host, or port selectors exposed by each override.
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of overrides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverrideList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
    post:
      operationId: createOverride
      tags: [Overrides]
      summary: Create an override
      description: Creates an override that changes finding interpretation for the selected NVT and optional task/result/host/port/severity scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOverride"
      responses:
        "201":
          description: Override created
          headers:
            Location:
              $ref: "./common.yaml#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/ResourceCreated"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /overrides/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getOverride
      tags: [Overrides]
      summary: Get an override
      description: Returns the details for a single override, including any related task/result identifiers, the annotated NVT/host/port selectors, and the replacement severity when one is set.
      responses:
        "200":
          description: Override details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Override"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    put:
      operationId: modifyOverride
      tags: [Overrides]
      summary: Modify an override
      description: Updates an override used for finding triage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOverride"
      responses:
        "200":
          description: Override updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Override"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    delete:
      operationId: deleteOverride
      tags: [Overrides]
      summary: Delete an override
      description: Deletes an override. Pass `ultimate=true` to request permanent backend deletion instead of the default non-ultimate delete.
      parameters:
        - $ref: "./common.yaml#/components/parameters/UltimateDelete"
      responses:
        "204":
          description: Override deleted
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /vulnerabilities:
    get:
      operationId: getVulnerabilities
      tags: [Vulnerabilities]
      summary: List vulnerabilities
      description: Returns a paginated list of vulnerabilities from the SecInfo database.
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of vulnerabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VulnerabilityList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /nvts:
    get:
      operationId: getNvts
      tags: [NVTs]
      summary: List NVTs
      description: Returns a paginated list of network vulnerability tests available in the feed catalog.
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of NVTs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NvtList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /nvts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: NVT OID
        schema:
          type: string
    get:
      operationId: getNvt
      tags: [NVTs]
      summary: Get an NVT
      description: Returns the details for a single network vulnerability test by OID.
      responses:
        "200":
          description: NVT details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nvt"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /nvt-families:
    get:
      operationId: getNvtFamilies
      tags: [NVT Families]
      summary: List NVT families
      description: Returns a paginated list of NVT families. This endpoint is collection-only and does not accept filter expressions.
      parameters:
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of NVT families
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NvtFamilyList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

components:
  schemas:
    Host:
      type: object
      required:
        - id
        - name
        - writable
        - inUse
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        comment:
          type: string
        creationTime:
          type: string
        modificationTime:
          type: string
        writable:
          type: boolean
        inUse:
          type: boolean
        ip:
          type: string
        hostname:
          type: string
        severity:
          type: string
        os:
          type: string

    HostList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Host"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    SupportingResourceMeta:
      type: object
      required:
        - id
        - name
        - writable
        - inUse
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        comment:
          type: string
        creationTime:
          type: string
        modificationTime:
          type: string
        writable:
          type: boolean
        inUse:
          type: boolean

    ReportFormat:
      type: object
      required:
        - id
        - name
        - writable
        - inUse
        - active
        - predefined
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        comment:
          type: string
        creationTime:
          type: string
        modificationTime:
          type: string
        writable:
          type: boolean
        inUse:
          type: boolean
        contentType:
          type: string
        extension:
          type: string
        summary:
          type: string
        trust:
          type: string
        active:
          type: boolean
        predefined:
          type: boolean

    ReportFormatList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ReportFormat"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    Filter:
      type: object
      required:
        - id
        - name
        - writable
        - inUse
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        comment:
          type: string
        creationTime:
          type: string
        modificationTime:
          type: string
        writable:
          type: boolean
        inUse:
          type: boolean
        type:
          type: string
        term:
          type: string

    FilterList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Filter"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    TagResource:
      type: object
      required:
        - id
        - name
        - writable
        - inUse
        - active
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        comment:
          type: string
        creationTime:
          type: string
        modificationTime:
          type: string
        writable:
          type: boolean
        inUse:
          type: boolean
        value:
          type: string
        resourceType:
          type: string
        resourceCount:
          type: integer
        active:
          type: boolean

    TagList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TagResource"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    Ticket:
      type: object
      required:
        - id
        - name
        - writable
        - inUse
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        comment:
          type: string
        creationTime:
          type: string
        modificationTime:
          type: string
        writable:
          type: boolean
        inUse:
          type: boolean
        status:
          type: string
        assignedTo:
          $ref: "./common.yaml#/components/schemas/ResourceRef"
        result:
          $ref: "./common.yaml#/components/schemas/ResourceRef"
        task:
          $ref: "./common.yaml#/components/schemas/ResourceRef"
        openNote:
          type: string
        fixedNote:
          type: string
        closedNote:
          type: string

    TicketList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Ticket"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    Note:
      type: object
      required:
        - id
        - name
        - writable
        - inUse
        - active
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        comment:
          type: string
        creationTime:
          type: string
        modificationTime:
          type: string
        writable:
          type: boolean
        inUse:
          type: boolean
        text:
          type: string
        nvt:
          $ref: "./results.yaml#/components/schemas/NvtRef"
        hosts:
          type: array
          items:
            type: string
        port:
          type: string
        severity:
          type: string
        task:
          $ref: "./common.yaml#/components/schemas/ResourceRef"
        result:
          $ref: "./common.yaml#/components/schemas/ResourceRef"
        active:
          type: boolean
        endTime:
          type: string

    NoteList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    CreateNote:
      type: object
      required:
        - nvtOid
      properties:
        nvtOid:
