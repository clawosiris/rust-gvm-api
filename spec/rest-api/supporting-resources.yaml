components:
  parameters:
    SecInfoId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: SecInfo identifier such as a CVE, CPE, or advisory id

  schemas:
    Host:
      type: object
      required:
        - id
        - name
        - writable
        - inUse
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        comment:
          type: string
        creationTime:
          type: string
        modificationTime:
          type: string
        writable:
          type: boolean
        inUse:
          type: boolean
        ip:
          type: string
        hostname:
          type: string
        severity:
          type: string
        os:
          type: string

    HostList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Host"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    OperatingSystemHost:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        severity:
          type: string

    OperatingSystem:
      type: object
      required:
        - id
        - name
        - writable
        - inUse
        - title
        - installs
        - allInstalls
        - hostCount
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        comment:
          type: string
        creationTime:
          type: string
        modificationTime:
          type: string
        writable:
          type: boolean
        inUse:
          type: boolean
        value:
          type: string
        hostsCount:
          type: integer
        severity:
          type: string
        title:
          type: string
        installs:
          type: integer
        allInstalls:
          type: integer
        latestSeverity:
          type: string
        highestSeverity:
          type: string
        averageSeverity:
          type: string
        hostCount:
          type: integer
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/OperatingSystemHost"

    OperatingSystemList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OperatingSystem"
        pagination:
