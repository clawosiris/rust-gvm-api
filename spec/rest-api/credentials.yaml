openapi: 3.1.0

paths:
  /credentials:
    get:
      operationId: getCredentials
      tags: [Credentials]
      summary: List credentials
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
    post:
      operationId: createCredential
      tags: [Credentials]
      summary: Create a credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCredential"
      responses:
        "201":
          description: Credential created
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/ResourceCreated"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /credentials/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getCredential
      tags: [Credentials]
      summary: Get a credential
      responses:
        "200":
          description: Credential details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    put:
      operationId: modifyCredential
      tags: [Credentials]
      summary: Modify a credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyCredential"
      responses:
        "200":
          description: Credential updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    delete:
      operationId: deleteCredential
      tags: [Credentials]
      summary: Delete a credential
      responses:
        "204":
          description: Credential deleted
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

components:
  schemas:
    Credential:
      type: object
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        comment:
          type: string
        type:
          $ref: "./common.yaml#/components/schemas/CredentialType"
        login:
          type: string
        inUse:
          type: boolean
        writable:
          type: boolean

    CreateCredential:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        comment:
          type: string
        type:
          $ref: "./common.yaml#/components/schemas/CredentialType"
        login:
          type: string
        password:
          type: string
          format: password
        privateKey:
          type: string
          description: PEM-encoded private key (for `usk` type).
        certificate:
          type: string
          description: PEM-encoded certificate (for `cc` type).
        community:
          type: string
          description: SNMP community string (for `snmp` type).
        authAlgorithm:
          type: string
          enum:
            - md5
            - sha1
          description: SNMP auth algorithm (for `snmpv3` type).
        privacyAlgorithm:
          type: string
          enum:
            - aes
            - des
          description: SNMP privacy algorithm (for `snmpv3` type).
        privacyPassword:
          type: string
          format: password
          description: SNMP privacy password (for `snmpv3` type).

    ModifyCredential:
      type: object
      properties:
        name:
          type: string
        comment:
          type: string
        login:
          type: string
        password:
          type: string
          format: password
        privateKey:
          type: string
        certificate:
          type: string

    CredentialList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"
